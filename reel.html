<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 · Month by Month</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap');

  :root{
    --bg1-rgb: 12,14,28;
    --bg2-rgb: 22,26,52;
    --accent-rgb: 255,200,87;
    --accent2-rgb: 255,236,190;
    --gold-rgb: 255,214,120;
    --text-rgb: 255,250,240;

    --bg1:rgb(var(--bg1-rgb));
    --bg2:rgb(var(--bg2-rgb));
    --accent:rgb(var(--accent-rgb));
    --accent2:rgb(var(--accent2-rgb));
    --gold:rgb(var(--gold-rgb));

    --glass-fill:rgba(255,255,255,.08);
    --glass-fill-strong:rgba(255,255,255,.14);
    --glass-border:rgba(255,255,255,.22);
    --glass-border-soft:rgba(255,255,255,.14);

    --text-light:rgba(var(--text-rgb),.97);
    --text-muted:rgba(var(--text-rgb),.78);

    --ease-smooth:cubic-bezier(.22,1,.36,1);
    --ease-turn:cubic-bezier(.645,.045,.355,1);
    --ease-snap:cubic-bezier(.34,1.1,.48,1);
    --turn-duration:.48s;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 18% 18%,rgba(var(--accent-rgb),.13),transparent 27%),
      radial-gradient(circle at 82% 78%,rgba(var(--gold-rgb),.08),transparent 25%),
      radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,#1c0e16 58%,#0c0709 100%);
    font-family:'Jost',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  .bokeh{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .bok{
    position:absolute;border-radius:50%;filter:blur(60px);opacity:.18;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-20px) scale(1.1);}
    100%{transform:translate(0,0) scale(1);}
  }

  .ambient{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .ambient-item{
    position:absolute; top:-8%; font-size:1rem; opacity:0;
    animation:ambientFall linear infinite;
    filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.25));
  }
  @keyframes ambientFall{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    8%{opacity:.65;}
    92%{opacity:.55;}
    100%{transform:translateY(112vh) translateX(var(--drift,20px)) rotate(340deg); opacity:0;}
  }

  .glass{
    background:
      linear-gradient(145deg,var(--glass-fill-strong),var(--glass-fill) 55%,rgba(var(--accent-rgb),.05)),
      rgba(48,14,30,.42);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(150%);
    -webkit-backdrop-filter:blur(24px) saturate(150%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(255,255,255,.05);
  }

  .stage{
    width:min(390px,92vw);
    height:min(640px,92vh);
    position:relative;
    z-index:10;
    perspective:1900px;
    perspective-origin:50% 40%;
    transform-style:preserve-3d;
  }

  .stage::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:2%;
    width:75%;
    height:38px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(0,0,0,.5);
    filter:blur(22px);
    transition:all 1.3s var(--ease-smooth);
  }
  .stage.opened::after{ width:58%; opacity:.35; }

  /* ---------- Vintage 35mm film roll ---------- */
  .film-roll{
    position:absolute;
    left:50%;
    bottom:16%;
    transform:translateX(-50%);
    z-index:20;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform 1s var(--ease-smooth), opacity .8s ease, filter .8s ease;
  }
  .film-roll:focus-visible, .nav-btn:focus-visible, .month-pill:focus-visible{
    outline:2px solid var(--accent2);
    outline-offset:4px;
  }

  .canister{
    position:relative;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform 1.1s var(--ease-smooth), opacity .7s ease .2s;
  }
  .canister-cap{
    width:108px;height:20px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 35%,#5c4a38,#2a2218 70%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .canister-cap.top{ margin-bottom:-6px; z-index:2; }
  .canister-cap.bottom{ margin-top:-6px; z-index:2; }
  .canister-body{
    width:96px;height:118px;
    background:
      linear-gradient(90deg,#241c14 0%,#4a3b2c 22%,#3d3228 50%,#4a3b2c 78%,#241c14 100%);
    border:1px solid rgba(255,255,255,.12);
    border-radius:6px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:6px;
    box-shadow:inset 0 2px 6px rgba(255,255,255,.06), 0 16px 36px rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
  }
  .canister-body::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      180deg,
      transparent 0, transparent 8px,
      rgba(0,0,0,.12) 8px, rgba(0,0,0,.12) 9px
    );
    pointer-events:none;
  }
  .canister-label{
    font-family:'Jost',sans-serif;
    font-size:.62rem;
    letter-spacing:.28em;
    color:rgba(255,236,190,.75);
    text-transform:uppercase;
    z-index:1;
  }
  .canister-spool{
    width:52px;height:52px;
    border-radius:50%;
    border:3px solid rgba(20,16,12,.8);
    background:
      radial-gradient(circle at 50% 50%,#1a1510 18%,transparent 19%),
      repeating-conic-gradient(from 0deg,#2a2218 0deg 8deg,#3d3228 8deg 16deg);
    box-shadow:inset 0 0 12px rgba(0,0,0,.5);
    z-index:1;
  }

  .film-strip{
    width:min(300px,78vw);
    height:68px;
    margin-top:-28px;
    position:relative;
    z-index:2;
    background:#14100c;
    border-top:7px solid #0a0806;
    border-bottom:7px solid #0a0806;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    overflow:hidden;
    transition:height 1.2s var(--ease-smooth) .15s, width 1.2s var(--ease-smooth) .15s, opacity .6s ease .4s;
  }
  .film-strip::before, .film-strip::after{
    content:"";
    position:absolute; left:0; right:0;
    height:7px;
    background:repeating-linear-gradient(90deg,#0a0806 0,#0a0806 5px,transparent 5px,transparent 13px);
    z-index:3;
  }
  .film-strip::before{ top:0; }
  .film-strip::after{ bottom:0; }
  .film-frames{
    position:absolute; inset:7px 0;
    display:flex; gap:4px;
    padding:0 8px;
    background:
      repeating-linear-gradient(90deg,#16120e 0,#16120e 44px,#12100c 44px,#12100c 48px);
    transition:transform 1.4s var(--ease-smooth) .2s;
  }
  .film-frame{
    flex:0 0 40px;
    height:100%;
    background:linear-gradient(145deg,rgba(var(--accent-rgb),.15),rgba(30,24,18,.9));
    border:1px solid rgba(255,255,255,.06);
    opacity:.7;
  }
  .film-frame:nth-child(odd){ opacity:.5; }

  .roll-prompt{
    margin-top:14px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-family:'Jost',sans-serif;
    font-size:.64rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--text-muted);
    pointer-events:none;
    animation:rollPulse 2.4s ease-in-out infinite;
    transition:opacity .4s ease;
  }
  .roll-prompt .roll-icon{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
    background:radial-gradient(circle at 35% 30%,rgba(var(--accent-rgb),.4),rgba(30,20,12,.85));
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 6px 18px rgba(var(--accent-rgb),.25);
  }
  @keyframes rollPulse{
    0%,100%{ opacity:.82; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-3px); }
  }

  .stage.opened .film-roll{
    pointer-events:none;
    transform:translateX(-50%) translateY(30px) scale(.88);
    opacity:0;
    filter:blur(8px);
  }
  .stage.opened .canister{
    transform:translateY(-40px) scale(.7) rotateX(20deg);
    opacity:0;
  }
  .stage.opened .film-strip{
    height:0;
    width:min(355px,86vw);
    opacity:0;
    margin-top:0;
  }
  .stage.opened .film-frames{
    transform:translateX(-120%);
  }
  .stage.opened .roll-prompt{ opacity:0; animation:none; }

  .card-emerge{
    position:absolute;
    width:min(355px,86vw);
    height:min(520px,74vh);
    left:50%;
    bottom:calc(16% + 8px);
    transform:translate3d(-50%,80px,0) scale(.78);
    transform-style:preserve-3d;
    opacity:0;
    z-index:30;
    pointer-events:none;
    clip-path:inset(55% 8% 55% 8% round 4px);
    transition:transform 1.15s var(--ease-smooth), opacity .7s ease, clip-path 1.15s var(--ease-smooth);
    will-change:transform,opacity,clip-path;
  }
  .stage.opened .card-emerge{
    transform:translate3d(-50%,-24px,80px) rotateX(0deg) scale(1);
    opacity:1;
    clip-path:inset(0 0 0 0 round 24px);
    pointer-events:auto;
    transition:transform 1.15s var(--ease-smooth) .55s,
               opacity .65s ease .55s,
               clip-path 1.15s var(--ease-smooth) .55s;
  }
  .stage.opened .card-emerge:hover{
    transform:translate3d(-50%,-31px,88px) scale(1.012);
  }

  .card-3d{
    width:100%; height:100%; position:relative;
    transform-style:preserve-3d;
    filter:drop-shadow(0 34px 35px rgba(0,0,0,.4));
    transition:transform .3s var(--ease-smooth);
  }

  .card-open{
    position:absolute; inset:0;
    border-radius:24px;
    outline:1px solid rgba(var(--accent2-rgb),.16);
    overflow:hidden;
    box-shadow:0 38px 85px rgba(0,0,0,.52), 0 12px 35px rgba(var(--accent-rgb),.08);
  }

  .glass-inner{
    height:100%;
    border-radius:24px;
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  .glass-inner::before{
    content:"";
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 15% 5%,rgba(var(--text-rgb),.16),transparent 25%),
      linear-gradient(120deg,rgba(255,255,255,.07),transparent 35%,rgba(var(--accent-rgb),.025) 72%);
    z-index:10;
  }
  .glass-inner::after{
    content:"";
    position:absolute; top:-25%; left:-60%; width:70%; height:150%;
    transform:rotate(18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
    filter:blur(8px);
    transition:transform 1.3s var(--ease-smooth);
    pointer-events:none; z-index:11;
  }
  .card-open:hover .glass-inner::after{ transform:translateX(205%) rotate(18deg); }

  .inner-top{
    padding:14px 18px 10px;
    border-bottom:1px solid var(--glass-border-soft);
    flex-shrink:0;
    position:relative; z-index:25;
  }
  .inner-occasion{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.95rem;
    color:var(--accent2);
    letter-spacing:.02em;
    margin-bottom:10px;
  }

  .month-rail{
    display:flex;
    gap:5px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .month-rail::-webkit-scrollbar{ display:none; }
  .month-pill{
    flex:0 0 auto;
    min-width:34px;
    padding:4px 7px;
    border-radius:99px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    font-family:'Jost',sans-serif;
    font-size:.58rem;
    letter-spacing:.06em;
    color:var(--text-muted);
    cursor:pointer;
    transition:all .35s var(--ease-smooth);
    -webkit-tap-highlight-color:transparent;
  }
  .month-pill.active{
    background:rgba(var(--accent-rgb),.22);
    border-color:rgba(var(--accent-rgb),.55);
    color:var(--accent2);
    transform:scale(1.06);
    box-shadow:0 0 12px rgba(var(--accent-rgb),.25);
  }

  .inner-nav{
    padding:10px 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid var(--glass-border-soft);
    flex-shrink:0;
    position:relative; z-index:25;
  }
  .nav-from{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.8rem;
    color:var(--text-muted);
    text-align:center;
    line-height:1.3;
  }
  .nav-from .nav-counter{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:.58rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:2px;
  }
  .nav-btn{
    background:rgba(255,255,255,.06);
    border:1px solid var(--glass-border-soft);
    color:var(--text-muted);
    font-family:'Jost',sans-serif;
    font-size:.68rem;
    letter-spacing:.08em;
    padding:7px 14px;
    border-radius:99px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    -webkit-tap-highlight-color:transparent;
    transition:transform .3s var(--ease-smooth), background .3s ease, border-color .3s ease, color .3s ease;
    white-space:nowrap;
  }
  .nav-btn:hover{
    border-color:var(--accent);
    color:var(--accent2);
    background:rgba(var(--accent-rgb),.1);
    transform:translateY(-2px);
  }
  .nav-btn:active{ transform:translateY(0) scale(.96); }
  .nav-btn:disabled{
    opacity:.22; cursor:default;
    border-color:rgba(255,255,255,.06);
    transform:none;
  }

  .pages-wrap{
    flex:1;
    position:relative;
    perspective:1500px;
    perspective-origin:0% 50%;
    min-height:0;
  }

  .leaf{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform-origin:0% 50%;
    transform:rotateY(0deg) translateZ(0px);
    transition:transform var(--turn-duration) var(--ease-snap);
    will-change:transform;
  }

  .leaf-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:0;
    overflow-x:hidden;
    overflow-y:auto;
    display:flex; flex-direction:column; justify-content:flex-start;
    gap:10px;
    padding:18px 20px 16px;
    scrollbar-width:thin;
  }
  .leaf-face::-webkit-scrollbar{ width:4px; }
  .leaf-face::-webkit-scrollbar-thumb{
    background:rgba(var(--accent-rgb),.35);
    border-radius:99px;
  }

  .leaf-front{
    background-color: var(--bg1);
    background-image:
      linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.025) 48%,rgba(var(--accent-rgb),.05)),
      linear-gradient(160deg,rgba(var(--accent-rgb),.32),var(--bg2) 55%,var(--bg1));
  }
  .leaf-back{
    transform:rotateY(180deg);
    background-color: var(--bg1);
    background-image:
      linear-gradient(215deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 50%,rgba(var(--gold-rgb),.05)),
      linear-gradient(200deg,var(--bg2),var(--bg1));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .leaf-back-deco{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.9rem;
    color:rgba(var(--accent2-rgb),.28);
    letter-spacing:.08em;
    text-align:center;
  }

  .leaf-front::before, .leaf-back::before{
    content:"";
    position:absolute; inset:0; left:0; width:46px;
    background:linear-gradient(90deg,rgba(0,0,0,.24),transparent);
    pointer-events:none;
  }
  .leaf-back::before{ background:linear-gradient(90deg,rgba(0,0,0,.30),transparent); }

  .leaf::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.42),transparent 55%);
    opacity:0;
    transition:opacity var(--turn-duration) var(--ease-snap);
    pointer-events:none;
    z-index:5;
  }
  .leaf.mid-turn::after{ opacity:1; }

  .page-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .page-label{
    font-family:'Jost',sans-serif;
    font-size:.62rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .page-month-num{
    font-family:'Cormorant Garamond',serif;
    font-size:2.4rem;
    font-weight:600;
    line-height:1;
    color:rgba(var(--accent2-rgb),.18);
    flex-shrink:0;
  }
  .page-title{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:1.55rem;
    color:var(--text-light);
    line-height:1.25;
  }
  .page-body{
    font-family:'Cormorant Garamond',serif;
    font-size:1rem;
    color:var(--text-muted);
    line-height:1.6;
  }

  .highlights{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .highlights li{
    font-family:'Jost',sans-serif;
    font-size:.72rem;
    letter-spacing:.02em;
    color:var(--text-light);
    padding:7px 10px 7px 22px;
    border-radius:8px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--glass-border-soft);
    position:relative;
    line-height:1.45;
  }
  .highlights li::before{
    content:"";
    position:absolute;
    left:9px; top:50%;
    transform:translateY(-50%);
    width:5px; height:5px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 6px rgba(var(--accent-rgb),.5);
  }
  .highlights-label{
    font-family:'Jost',sans-serif;
    font-size:.58rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:2px;
  }

  .glass-box{
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid var(--glass-border-soft);
    border-radius:12px;
    padding:11px 13px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.92rem;
    color:var(--text-light);
    line-height:1.65;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 8px 22px rgba(0,0,0,.1);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }

  .page-media{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  .page-media::-webkit-scrollbar{ height:5px; }
  .page-media::-webkit-scrollbar-thumb{
    background:rgba(var(--accent-rgb),.4);
    border-radius:99px;
  }
  .media-item{
    flex:0 0 auto;
    width:96px;
    height:96px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--glass-border-soft);
    box-shadow:0 8px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
    background:var(--bg2);
  }
  .media-item img, .media-item video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .media-item.is-video::after{
    content:"▶";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.9rem;
    color:rgba(255,255,255,.92);
    background:rgba(0,0,0,.22);
    pointer-events:none;
  }
  .media-label{
    font-family:'Jost',sans-serif;
    font-size:.58rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold);
  }

  /* year-end rewind overlay */
  .year-end-overlay{
    position:absolute; inset:0;
    z-index:50;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:10px;
    background:rgba(8,6,12,.72);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    pointer-events:none;
    transition:opacity .85s ease;
    border-radius:24px;
  }
  .year-end-overlay.visible{ opacity:1; }
  .year-end-text{
    font-family:'Cormorant Garamond',serif;
    font-size:1.85rem;
    font-weight:600;
    color:var(--text-light);
    letter-spacing:.04em;
  }
  .year-end-sub{
    font-family:'Jost',sans-serif;
    font-size:.62rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .year-end-spinner{
    width:28px;height:28px;
    border:2px solid rgba(var(--accent-rgb),.25);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:rewindSpin .9s linear infinite;
    margin-top:6px;
  }
  @keyframes rewindSpin{ to{ transform:rotate(-360deg); } }

  @media(max-width:600px){
    .stage{ width:100vw; height:100vh; }
    .film-roll{ bottom:14%; }
    .canister-body{ width:88px; height:108px; }
    .canister-cap{ width:98px; }
    .card-emerge{ width:min(88vw,355px); height:min(72vh,520px); bottom:calc(14% + 6px); }
    .stage.opened .card-emerge{ transform:translate3d(-50%,-18px,65px) rotateX(0deg) scale(1); }
  }

  @media(prefers-reduced-motion:reduce){
    .film-roll, .canister, .film-strip, .film-frames, .card-emerge, .leaf, .leaf::after,
    .heart-particle, .confetti, .bok, .roll-prompt, .ambient-item, .card-3d, .year-end-spinner{
      animation:none!important;
      transition:none!important;
    }
  }

  .heart-particle{
    position:fixed;pointer-events:none;z-index:199;
    font-size:1.1rem;
    animation:heartRise ease-out forwards;
  }
  @keyframes heartRise{
    0%{opacity:1;transform:translateY(0) scale(.5) rotate(-15deg);}
    60%{opacity:.9;transform:translateY(-110px) scale(1) rotate(10deg);}
    100%{opacity:0;transform:translateY(-190px) scale(.7) rotate(-5deg);}
  }

  .confetti{
    position:fixed;top:-10px;pointer-events:none;z-index:201;
    animation:cfetti linear forwards;
  }
  @keyframes cfetti{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}
</style>
</head>
<body>

<div class="bokeh">
  <div class="bok" style="width:280px;height:280px;background:var(--accent);top:5%;left:10%;animation-duration:12s;"></div>
  <div class="bok" style="width:200px;height:200px;background:rgba(var(--accent-rgb),.6);bottom:10%;right:8%;animation-duration:9s;animation-delay:3s;"></div>
  <div class="bok" style="width:160px;height:160px;background:var(--gold);top:50%;left:50%;animation-duration:15s;animation-delay:6s;opacity:.1;"></div>
</div>

<div class="ambient" id="ambient"></div>

<div class="stage" id="stage">
  <div class="film-roll" id="filmRoll" tabindex="0" role="button" aria-label="Film roll, tap to develop your year">
    <div class="canister">
      <div class="canister-cap top"></div>
      <div class="canister-body">
        <span class="canister-label">2025</span>
        <div class="canister-spool"></div>
      </div>
      <div class="canister-cap bottom"></div>
    </div>
    <div class="film-strip">
      <div class="film-frames">
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
      </div>
    </div>
    <div class="roll-prompt">
      <div class="roll-icon" id="sealIcon">🎞</div>
      <span id="promptText">Tap to develop</span>
    </div>
  </div>

  <div class="card-emerge" id="cardEmerge">
    <div class="card-3d" id="card3d">
      <div class="card-open glass" id="cardOpen">
        <div class="glass-inner">

          <div class="year-end-overlay" id="yearEndOverlay">
            <span class="year-end-text">That's a wrap</span>
            <span class="year-end-sub">Rewinding to January</span>
            <div class="year-end-spinner"></div>
          </div>

          <div class="inner-top">
            <div class="inner-occasion" id="innerOccasion"></div>
            <div class="month-rail" id="monthRail"></div>
          </div>

          <div class="pages-wrap" id="pagesWrap"></div>

          <div class="inner-nav">
            <button class="nav-btn" id="prevBtn">← Back</button>
            <div class="nav-from" id="navFrom"></div>
            <button class="nav-btn" id="nextBtn">Next →</button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
const THEMES = {
  romance: {
    bg1:'40,14,26', bg2:'62,18,42',
    accent:'232,80,122', accent2:'249,198,212', gold:'212,168,83',
    text:'255,245,248',
    particle:['🌹','✦','💗'], seal:'✦'
  },
  apology: {
    bg1:'24,20,36', bg2:'42,32,60',
    accent:'167,139,250', accent2:'221,210,255', gold:'196,181,253',
    text:'245,244,255',
    particle:['✦','🕊️','·'], seal:'🕊️'
  },
  birthday: {
    bg1:'32,18,8', bg2:'58,28,10',
    accent:'255,151,71', accent2:'255,214,153', gold:'255,196,74',
    text:'255,248,240',
    particle:['🎈','✨','🎉'], seal:'🎂'
  },
  gratitude: {
    bg1:'10,26,20', bg2:'16,44,32',
    accent:'92,196,141', accent2:'196,240,214', gold:'214,196,120',
    text:'240,255,247',
    particle:['🍃','✦','🌿'], seal:'❈'
  },
  celebration: {
    bg1:'14,16,34', bg2:'22,28,58',
    accent:'110,159,255', accent2:'196,216,255', gold:'255,212,120',
    text:'244,248,255',
    particle:['✨','🎊','★'], seal:'★'
  },
  newyear: {
    bg1:'12,14,28', bg2:'22,26,52',
    accent:'255,200,87', accent2:'255,236,190', gold:'255,214,120',
    text:'255,250,240',
    particle:['✨','🥂','⭐','🎊','🎆'], seal:'✦'
  }
};

const THEME_NAME = 'newyear';
const T = THEMES[THEME_NAME];
const root = document.documentElement.style;
root.setProperty('--bg1-rgb', T.bg1);
root.setProperty('--bg2-rgb', T.bg2);
root.setProperty('--accent-rgb', T.accent);
root.setProperty('--accent2-rgb', T.accent2);
root.setProperty('--gold-rgb', T.gold);
root.setProperty('--text-rgb', T.text);
document.getElementById('sealIcon').textContent = '🎞';

/* timing — forward flips snappy; year-end rewind unhurried */
const TURN_MS = 480;
const LOOP_OUT_MS = 900;
const LOOP_HOLD_MS = 1400;
const LOOP_IN_MS = 1100;

/* =============================================================
   CONTENT — one page per month. Edit title, body, highlights,
   box, and media for each. Put photos in ./photos/ and reference
   them in media: [{type:'image', src:'photos/jan-1.jpg'}]
   ============================================================= */
const CARD = {
  occasion:    '2025 · Month by Month',
  promptLabel: 'Tap to develop',
  from:        '— Yu',
  pages: [
    {
      month: 'January', short: 'Jan', num: '01',
      title: 'Fresh chapter',
      body:  'How the year started — resolutions, cold mornings, first plans together.',
      highlights: ['New year hangout', 'First trip of the year'],
      box:   null,
      media: null
    },
    {
      month: 'February', short: 'Feb', num: '02',
      title: 'Little moments',
      body:  'The quiet month — dinners, late texts, small wins that added up.',
      highlights: ['Valentine / friends day', 'Something you laughed about for weeks'],
      box:   null,
      media: null
    },
    {
      month: 'March', short: 'Mar', num: '03',
      title: 'Spring energy',
      body:  'Things picked up — outings, projects, that one weekend that felt like summer already.',
      highlights: ['Day trip or outing', 'A milestone at work or school'],
      box:   null,
      media: null
    },
    {
      month: 'April', short: 'Apr', num: '04',
      title: 'Chaos & color',
      body:  'Busy days, random adventures, photos you still scroll back to.',
      highlights: ['Concert / event / match', 'Best food spot discovery'],
      box:   null,
      media: null
    },
    {
      month: 'May', short: 'May', num: '05',
      title: 'On the move',
      body:  'Travel, long drives, being outside — the month that got us out of the house.',
      highlights: ['Trip or travel day', 'Sunset / view worth remembering'],
      box:   null,
      media: null
    },
    {
      month: 'June', short: 'Jun', num: '06',
      title: 'Peak summer',
      body:  'Heat, plans every weekend, the kind of tired that feels good.',
      highlights: ['Beach / pool / hill station', 'Group hang that went too late'],
      box:   null,
      media: null
    },
    {
      month: 'July', short: 'Jul', num: '07',
      title: 'Midyear check-in',
      body:  'Halfway through — some things worked, some didn\'t. Still showed up for each other.',
      highlights: ['Birthday or celebration', 'Project or goal progress'],
      box:   null,
      media: null
    },
    {
      month: 'August', short: 'Aug', num: '08',
      title: 'Late summer glow',
      body:  'Festive prep, monsoon vibes, memories before everything got busy again.',
      highlights: ['Festival or family thing', 'Rainy day memory'],
      box:   null,
      media: null
    },
    {
      month: 'September', short: 'Sep', num: '09',
      title: 'Back to rhythm',
      body:  'Routine returned but we still stole good days — coffee runs, quick catches.',
      highlights: ['Reunion or catch-up', 'Something new you tried'],
      box:   null,
      media: null
    },
    {
      month: 'October', short: 'Oct', num: '10',
      title: 'Festive season',
      body:  'Lights, food, family energy — and us in the middle of it all.',
      highlights: ['Diwali / Halloween / fest', 'Best meal of the month'],
      box:   null,
      media: null
    },
    {
      month: 'November', short: 'Nov', num: '11',
      title: 'Grateful pause',
      body:  'Slowing down just enough to notice what mattered this year.',
      highlights: ['Thanksgiving / friendsgiving', 'Quiet win or lesson'],
      box:   null,
      media: null
    },
    {
      month: 'December', short: 'Dec', num: '12',
      title: 'Closing the book',
      body:  'End-of-year energy — looking back, one last adventure, ready for what\'s next.',
      highlights: ['NYE plans or year-end trip', 'Best moment of 2025'],
      box:   'Happy New Year. Same us, new pages.',
      media: null
    }
  ]
};

document.getElementById('innerOccasion').textContent = CARD.occasion;
document.getElementById('promptText').textContent = CARD.promptLabel;

const stage           = document.getElementById('stage');
const filmRoll        = document.getElementById('filmRoll');
const pagesWrap       = document.getElementById('pagesWrap');
const monthRail       = document.getElementById('monthRail');
const prevBtn         = document.getElementById('prevBtn');
const nextBtn         = document.getElementById('nextBtn');
const navFrom         = document.getElementById('navFrom');
const card3d          = document.getElementById('card3d');
const glassInner      = document.querySelector('.glass-inner');
const yearEndOverlay  = document.getElementById('yearEndOverlay');

const total = CARD.pages.length;
let current = 0;
let opened = false;
let opening = false;
let animating = false;

function buildHighlightsHtml(items){
  if (!items || !items.length) return '';
  const lis = items.map(h => `<li>${h}</li>`).join('');
  return `<div class="highlights-label">Moments</div><ul class="highlights">${lis}</ul>`;
}

function buildMediaHtml(media){
  if (!media || !media.length) return '';
  const items = media.map(m => {
    if (m.type === 'video'){
      return `<div class="media-item is-video">
                <video src="${m.src}" muted playsinline preload="metadata"></video>
              </div>`;
    }
    return `<div class="media-item">
              <img src="${m.src}" alt="${m.caption ? m.caption.replace(/"/g,'&quot;') : ''}" loading="lazy">
            </div>`;
  }).join('');
  return `<div class="media-label">Photos</div><div class="page-media">${items}</div>`;
}

CARD.pages.forEach((p, i) => {
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  leaf.dataset.i = i;

  leaf.innerHTML = `
    <div class="leaf-face leaf-front">
      <div class="page-header">
        <div class="page-label">${p.month}</div>
        <div class="page-month-num">${p.num}</div>
      </div>
      <div class="page-title">${p.title}</div>
      <div class="page-body">${p.body}</div>
      ${buildHighlightsHtml(p.highlights)}
      ${p.box ? `<div class="glass-box">${p.box}</div>` : ''}
      ${buildMediaHtml(p.media)}
    </div>
    <div class="leaf-face leaf-back">
      <div class="leaf-back-deco">${T.seal}</div>
    </div>
  `;
  pagesWrap.appendChild(leaf);

  const pill = document.createElement('button');
  pill.type = 'button';
  pill.className = 'month-pill' + (i === 0 ? ' active' : '');
  pill.textContent = p.short;
  pill.title = p.month;
  pill.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
  monthRail.appendChild(pill);
});

const leaves = pagesWrap.querySelectorAll('.leaf');
const pills = monthRail.querySelectorAll('.month-pill');

const TURNED_Z = -8;
const STEP_Z   = 4;

function layoutLeaves(){
  leaves.forEach((leaf, i) => {
    leaf.classList.remove('mid-turn');
    if (i < current){
      leaf.style.transform = `rotateY(-178deg) translateZ(${TURNED_Z}px)`;
      leaf.style.zIndex = i;
      leaf.style.pointerEvents = 'none';
    } else {
      const depth = (i - current) * STEP_Z;
      leaf.style.transform = `rotateY(0deg) translateZ(${-depth}px)`;
      leaf.style.zIndex = (total - i) + 100;
      leaf.style.pointerEvents = (i === current) ? 'auto' : 'none';
    }
  });
}

function scrollActivePillIntoView(){
  const active = pills[current];
  if (active) active.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
}

function syncUI(){
  pills.forEach((p, i) => p.classList.toggle('active', i === current));
  scrollActivePillIntoView();

  const page = CARD.pages[current];
  const nextShort = current < total - 1 ? CARD.pages[current + 1].short : CARD.pages[0].short;

  navFrom.innerHTML = `${CARD.from}<span class="nav-counter">${page.month} · ${current + 1}/${total}</span>`;
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === total - 1 ? `${nextShort} ↻` : `${nextShort} →`;
}

layoutLeaves();
syncUI();
prevBtn.disabled = true;

function turnForward(i, cb){
  const leaf = leaves[i];
  leaf.style.zIndex = 999;
  leaf.classList.add('mid-turn');
  requestAnimationFrame(() => {
    leaf.style.transform = `rotateY(-178deg) translateZ(${TURNED_Z}px)`;
  });
  setTimeout(() => { if (cb) cb(); }, TURN_MS);
}

function turnBackward(i, cb){
  const leaf = leaves[i];
  leaf.style.zIndex = 999;
  leaf.classList.add('mid-turn');
  requestAnimationFrame(() => {
    leaf.style.transform = `rotateY(0deg) translateZ(0px)`;
  });
  setTimeout(() => { if (cb) cb(); }, TURN_MS);
}

function goTo(target){
  if (animating || target === current || target < 0 || target >= total) return;
  const diff = Math.abs(target - current);

  /* month-rail jumps skip flipping every leaf */
  if (diff > 1){
    animating = true;
    glassInner.style.transition = `opacity ${TURN_MS}ms ease, transform ${TURN_MS}ms ease`;
    glassInner.style.opacity = '0.35';
    glassInner.style.transform = 'scale(0.97)';
    setTimeout(() => {
      current = target;
      layoutLeaves();
      glassInner.style.transform = 'scale(1)';
      glassInner.style.opacity = '1';
      animating = false;
      syncUI();
    }, TURN_MS + 40);
    return;
  }

  animating = true;
  const dir = target > current ? 1 : -1;

  function step(){
    if (current === target){
      animating = false;
      layoutLeaves();
      syncUI();
      return;
    }
    if (dir === 1){
      const i = current;
      turnForward(i, () => { current = i + 1; layoutLeaves(); step(); });
    } else {
      const i = current - 1;
      turnBackward(i, () => { current = i; layoutLeaves(); step(); });
    }
  }
  step();
}

function loopToStart(){
  if (animating) return;
  animating = true;
  yearEndOverlay.classList.add('visible');

  glassInner.style.transition = `opacity ${LOOP_OUT_MS}ms ease, transform ${LOOP_OUT_MS}ms ease`;
  glassInner.style.opacity = '0';
  glassInner.style.transform = 'scale(0.94)';

  setTimeout(() => {
    current = 0;
    layoutLeaves();
    glassInner.style.transition = 'none';
    glassInner.style.opacity = '0';
    glassInner.style.transform = 'scale(0.96)';

    requestAnimationFrame(() => {
      glassInner.style.transition = `opacity ${LOOP_IN_MS}ms ease ${LOOP_HOLD_MS * 0.15}ms, transform ${LOOP_IN_MS}ms ease ${LOOP_HOLD_MS * 0.15}ms`;
      glassInner.style.opacity = '1';
      glassInner.style.transform = 'scale(1)';
    });

    setTimeout(() => {
      yearEndOverlay.classList.remove('visible');
      animating = false;
      syncUI();
    }, LOOP_HOLD_MS + LOOP_IN_MS);
  }, LOOP_OUT_MS);
}

function advance(){
  if (animating) return;
  if (current < total - 1) goTo(current + 1);
  else loopToStart();
}

prevBtn.addEventListener('click', e => { e.stopPropagation(); if (current > 0) goTo(current - 1); });
nextBtn.addEventListener('click', e => { e.stopPropagation(); advance(); });

filmRoll.addEventListener('click', openRoll);
filmRoll.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRoll(); } });

function openRoll(){
  if (opened || opening) return;
  opening = true;
  stage.classList.add('opened');
  setTimeout(() => {
    opened = true;
    opening = false;
    launchConfetti();
  }, 2000);
}

document.getElementById('cardEmerge').addEventListener('click', e => {
  if (!opened || animating) return;
  if (e.target.closest('.nav-btn') || e.target.closest('.month-pill')) return;
  advance();
});

document.addEventListener('click', e => {
  if (!opened) return;
  if (e.target.closest('.nav-btn') || e.target.closest('.month-pill')) return;
  spawnHearts(e.clientX, e.clientY, 3);
});

function spawnHearts(x, y, n){
  for(let i = 0; i < n; i++){
    const h = document.createElement('div');
    h.className = 'heart-particle';
    h.textContent = T.particle[Math.floor(Math.random() * T.particle.length)];
    h.style.left = (x + (Math.random() - .5) * 60) + 'px';
    h.style.top = y + 'px';
    h.style.animationDuration = (.8 + Math.random() * .6) + 's';
    h.style.animationDelay = (Math.random() * .2) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1400);
  }
}

function launchConfetti(){
  for(let i = 0; i < 55; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.width = (5 + Math.random() * 6) + 'px';
    c.style.height = (8 + Math.random() * 8) + 'px';
    c.style.background = `rgba(${Math.random() > .5 ? T.accent : T.gold},${.75 + Math.random()*.25})`;
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    c.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * .6) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

const ambientHost = document.getElementById('ambient');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduceMotion){
  const COUNT = 10;
  for (let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'ambient-item';
    el.textContent = T.particle[Math.floor(Math.random() * T.particle.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (0.7 + Math.random() * 0.9) + 'rem';
    el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    el.style.animationDuration = (10 + Math.random() * 12) + 's';
    el.style.animationDelay = (Math.random() * 14) + 's';
    ambientHost.appendChild(el);
  }
}

if (!reduceMotion && matchMedia('(hover:hover)').matches){
  document.getElementById('cardEmerge').addEventListener('mousemove', e => {
    if (!opened) return;
    const r = e.currentTarget.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5;
    const py = (e.clientY - r.top) / r.height - .5;
    card3d.style.transform = `rotateY(${px * 6}deg) rotateX(${-py * 6}deg)`;
  });
  document.getElementById('cardEmerge').addEventListener('mouseleave', () => {
    card3d.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });
}
</script>
</body>
</html>
