<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12080c">
<title>Our Soundtrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0c0608;--bg-mid:#160c10;--bg-card:#1e1016;
  --rose:#e85d7a;--rose-soft:#f4a4b4;--rose-glow:rgba(232,93,122,.35);
  --blush:#ffd6e0;--cream:#fff5f7;--muted:rgba(255,245,247,.5);
  --vinyl:#0a0a0a;--groove:rgba(255,255,255,.04);--label:#c41e3a;
  --gold:#d4a574;--ease:cubic-bezier(.22,1,.36,1);
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100dvh;font-family:'Libre Franklin',system-ui,sans-serif;
  color:var(--cream);background:var(--bg-deep);overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  padding:var(--safe-top) 0 var(--safe-bottom);
}
.app{
  width:100%;max-width:480px;min-height:100dvh;margin:0 auto;
  position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(232,93,122,.12),transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(212,165,116,.06),transparent 50%),
    linear-gradient(180deg,var(--bg-deep) 0%,var(--bg-mid) 45%,var(--bg-deep) 100%);
}

/* ── Intro ── */
.intro{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.25rem;padding:2rem;
  background:var(--bg-deep);text-align:center;
  transition:opacity .8s var(--ease),visibility .8s;
}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
.intro-badge{
  font-size:.65rem;letter-spacing:.35em;text-transform:uppercase;
  color:var(--rose-soft);opacity:.7;
}
.intro h1{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem,14vw,4rem);
  letter-spacing:.04em;line-height:.95;color:var(--cream);
}
.intro .couple{
  font-size:.85rem;font-weight:300;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-top:.25rem;
}
.intro-hint{
  margin-top:1.5rem;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;
  color:rgba(232,93,122,.45);animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.intro-btn{
  margin-top:.5rem;padding:.9rem 2.2rem;border:1px solid rgba(232,93,122,.4);
  background:rgba(232,93,122,.08);color:var(--cream);font-family:inherit;
  font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  border-radius:999px;transition:background .3s,border-color .3s,transform .2s;
}
.intro-btn:hover,.intro-btn:focus-visible{
  background:rgba(232,93,122,.18);border-color:var(--rose);outline:none;
}
.intro-btn:active{transform:scale(.97)}

/* ── Main layout ── */
.main{
  min-height:100dvh;display:flex;flex-direction:column;
  opacity:0;transform:translateY(12px);
  transition:opacity .9s var(--ease) .1s,transform .9s var(--ease) .1s;
}
.main.visible{opacity:1;transform:none}

.header{
  padding:1.25rem 1.25rem .5rem;text-align:center;flex-shrink:0;
}
.header-label{
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-soft);opacity:.65;
}
.header h2{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(1.6rem,7vw,2rem);
  letter-spacing:.06em;margin-top:.15rem;
}
.header .meta{font-size:.72rem;color:var(--muted);margin-top:.2rem;letter-spacing:.08em}

/* ── Vinyl stage ── */
.vinyl-stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:1rem 1.25rem;position:relative;min-height:min(52vw,240px);
}
.vinyl-wrap{
  position:relative;width:min(72vw,280px);aspect-ratio:1;
}
.vinyl-shadow{
  position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);
  filter:blur(12px);transform:translateY(8%);
}
.vinyl{
  position:relative;width:100%;height:100%;border-radius:50%;
  background:
    repeating-radial-gradient(circle at center,
      var(--groove) 0 1px,transparent 1px 3px),
    radial-gradient(circle at 38% 32%,rgba(255,255,255,.06),transparent 40%),
    conic-gradient(from 0deg,#111,#1a1a1a,#0d0d0d,#181818,#111);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.04),
    0 12px 40px rgba(0,0,0,.55),
    inset 0 0 60px rgba(0,0,0,.4);
  transition:transform .6s var(--ease);
}
.vinyl.playing{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.vinyl::before{
  content:'';position:absolute;inset:3%;border-radius:50%;
  border:1px solid rgba(255,255,255,.03);
  background:repeating-radial-gradient(circle at center,
    transparent 0 2px,rgba(255,255,255,.025) 2px 3px);
  pointer-events:none;
}

/* Album art / label */
.label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:38%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 3px rgba(20,20,20,.9),0 0 0 4px rgba(255,255,255,.06);
}
.label-art{
  width:100%;height:100%;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.2),transparent 50%),
    linear-gradient(145deg,#e85d7a 0%,#9b2d4a 50%,#5c1528 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(.55rem,3.2vw,.85rem);
  letter-spacing:.08em;text-align:center;padding:.4rem;line-height:1.1;
  color:var(--cream);
}
.label-hole{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:10%;aspect-ratio:1;border-radius:50%;
  background:var(--bg-deep);box-shadow:inset 0 1px 3px rgba(0,0,0,.8);
  z-index:2;
}

/* Tonearm */
.tonearm{
  position:absolute;top:6%;right:-4%;width:42%;height:42%;
  transform-origin:78% 12%;transform:rotate(-18deg);
  transition:transform .7s var(--ease);pointer-events:none;z-index:3;
}
.tonearm.playing{transform:rotate(8deg)}
.tonearm-pivot{
  position:absolute;top:8%;right:18%;width:10%;aspect-ratio:1;border-radius:50%;
  background:linear-gradient(145deg,#888,#444);box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.tonearm-arm{
  position:absolute;top:12%;right:22%;width:3px;height:78%;
  background:linear-gradient(180deg,#aaa,#666);border-radius:2px;
  transform-origin:top center;transform:rotate(12deg);
}
.tonearm-head{
  position:absolute;bottom:2%;left:50%;transform:translateX(-50%);
  width:14px;height:20px;background:#555;border-radius:2px 2px 4px 4px;
}

/* ── Waveform ── */
.waveform-wrap{
  padding:0 1.25rem .75rem;flex-shrink:0;
}
.waveform{
  display:flex;align-items:flex-end;justify-content:center;gap:3px;
  height:36px;opacity:.55;transition:opacity .4s;
}
.waveform.active{opacity:1}
.waveform-bar{
  width:4px;border-radius:2px;background:linear-gradient(180deg,var(--rose-soft),var(--rose));
  transform-origin:bottom;animation:none;
}
.waveform.active .waveform-bar{animation:wave 1.1s ease-in-out infinite}
.waveform-bar:nth-child(1){height:12px;animation-delay:0s}
.waveform-bar:nth-child(2){height:22px;animation-delay:.08s}
.waveform-bar:nth-child(3){height:16px;animation-delay:.16s}
.waveform-bar:nth-child(4){height:28px;animation-delay:.04s}
.waveform-bar:nth-child(5){height:18px;animation-delay:.12s}
.waveform-bar:nth-child(6){height:32px;animation-delay:.2s}
.waveform-bar:nth-child(7){height:20px;animation-delay:.06s}
.waveform-bar:nth-child(8){height:26px;animation-delay:.14s}
.waveform-bar:nth-child(9){height:14px;animation-delay:.1s}
.waveform-bar:nth-child(10){height:24px;animation-delay:.18s}
.waveform-bar:nth-child(11){height:18px;animation-delay:.02s}
.waveform-bar:nth-child(12){height:30px;animation-delay:.22s}
.waveform-bar:nth-child(13){height:16px;animation-delay:.08s}
.waveform-bar:nth-child(14){height:22px;animation-delay:.16s}
.waveform-bar:nth-child(15){height:12px;animation-delay:.04s}
.waveform-bar:nth-child(16){height:28px;animation-delay:.12s}
.waveform-bar:nth-child(17){height:20px;animation-delay:.2s}
.waveform-bar:nth-child(18){height:14px;animation-delay:.06s}
.waveform-bar:nth-child(19){height:26px;animation-delay:.14s}
.waveform-bar:nth-child(20){height:18px;animation-delay:.1s}
@keyframes wave{
  0%,100%{transform:scaleY(.35)}
  50%{transform:scaleY(1)}
}

/* ── Track info ── */
.track-info{
  padding:0 1.5rem .5rem;text-align:center;flex-shrink:0;
}
.track-num{
  font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--rose-soft);opacity:.7;
}
.track-title{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4rem,6vw,1.75rem);
  letter-spacing:.04em;margin-top:.15rem;line-height:1.1;
}
.track-memory{
  font-size:.82rem;font-weight:300;line-height:1.55;color:var(--muted);
  margin-top:.5rem;max-height:3.1em;overflow:hidden;
  transition:max-height .5s var(--ease),opacity .4s;
}
.track-memory.expanded{max-height:12em}
.track-lyrics{
  font-size:.78rem;font-style:italic;font-weight:300;line-height:1.6;
  color:rgba(255,214,224,.55);margin-top:.6rem;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .5s var(--ease),opacity .4s,margin .4s;
}
.track-lyrics.visible{max-height:8em;opacity:1;margin-top:.75rem}
.lyrics-toggle{
  margin-top:.5rem;background:none;border:none;color:var(--rose-soft);
  font-family:inherit;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;
  cursor:pointer;opacity:.6;transition:opacity .2s;
}
.lyrics-toggle:hover,.lyrics-toggle:focus-visible{opacity:1;outline:none}

/* ── Player controls ── */
.player{
  padding:.75rem 1.25rem 1rem;flex-shrink:0;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.25));
}
.progress-wrap{
  display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem;
  font-size:.65rem;color:var(--muted);letter-spacing:.05em;
}
.progress-bar{
  flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:2px;
  overflow:hidden;cursor:pointer;
}
.progress-fill{
  height:100%;width:0%;background:linear-gradient(90deg,var(--rose),var(--rose-soft));
  border-radius:2px;transition:width .15s linear;
}
.controls{
  display:flex;align-items:center;justify-content:center;gap:1.5rem;
}
.ctrl-btn{
  background:none;border:none;color:var(--cream);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s,transform .15s,opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.ctrl-btn:hover,.ctrl-btn:focus-visible{color:var(--rose-soft);outline:none}
.ctrl-btn:active{transform:scale(.9)}
.ctrl-btn svg{width:22px;height:22px;fill:currentColor}
.ctrl-btn.play-btn{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,var(--rose),#c43d5c);
  color:var(--cream);box-shadow:0 4px 20px var(--rose-glow);
}
.ctrl-btn.play-btn svg{width:26px;height:26px}
.ctrl-btn.play-btn:hover,.ctrl-btn.play-btn:focus-visible{color:var(--cream);transform:scale(1.04)}
.ctrl-btn.play-btn:active{transform:scale(.95)}
.ctrl-btn.skip-btn svg{width:20px;height:20px;opacity:.85}

/* ── Track list ── */
.tracklist{
  padding:0 1rem 1.25rem;flex-shrink:0;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .5s var(--ease),opacity .4s,padding .4s;
}
.tracklist.open{max-height:320px;opacity:1;padding-bottom:calc(1.25rem + var(--safe-bottom))}
.tracklist-toggle{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  width:100%;padding:.6rem;background:none;border:none;
  color:var(--muted);font-family:inherit;font-size:.65rem;
  letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
  transition:color .2s;
}
.tracklist-toggle:hover,.tracklist-toggle:focus-visible{color:var(--rose-soft);outline:none}
.tracklist-toggle svg{width:14px;height:14px;fill:currentColor;transition:transform .3s}
.tracklist.open .tracklist-toggle svg{transform:rotate(180deg)}
.tracklist-inner{
  margin-top:.5rem;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  overflow:hidden;
}
.track-item{
  display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
  color:var(--cream);font-family:inherit;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.track-item:last-child{border-bottom:none}
.track-item:hover,.track-item:focus-visible{background:rgba(232,93,122,.08);outline:none}
.track-item.active{background:rgba(232,93,122,.12)}
.track-item-num{
  font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--rose-soft);
  min-width:1.5rem;opacity:.7;
}
.track-item-title{
  font-size:.85rem;font-weight:400;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.track-item-dur{font-size:.65rem;color:var(--muted)}
.track-item-playing{
  width:14px;height:14px;display:none;flex-shrink:0;
}
.track-item.active .track-item-playing{display:flex;align-items:flex-end;gap:2px}
.track-item.active .track-item-num{opacity:0;width:0;min-width:0;overflow:hidden}
.mini-bar{
  width:2px;background:var(--rose);border-radius:1px;
  animation:wave .8s ease-in-out infinite;
}
.mini-bar:nth-child(1){height:6px}
.mini-bar:nth-child(2){height:10px;animation-delay:.1s}
.mini-bar:nth-child(3){height:5px;animation-delay:.2s}

/* ── Ambient glow ── */
.glow{
  position:fixed;pointer-events:none;z-index:0;
  width:min(90vw,400px);height:min(90vw,400px);
  top:20%;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(232,93,122,.08),transparent 65%);
  transition:opacity .6s;
}
.glow.playing{opacity:1.4}
</style>
</head>
<body>
<div class="app">
  <div class="glow" id="glow"></div>

  <!-- Intro -->
  <section class="intro" id="intro">
    <span class="intro-badge">Side A</span>
    <h1 id="introTitle">Our Soundtrack</h1>
    <p class="couple" id="introCouple">Alex &amp; Jordan</p>
    <p class="intro-hint">Tap to drop the needle</p>
    <button class="intro-btn" id="introBtn" type="button">Play Album</button>
  </section>

  <!-- Main player -->
  <main class="main" id="main">
    <header class="header">
      <p class="header-label">Now Spinning</p>
      <h2 id="albumTitle">Our Soundtrack</h2>
      <p class="meta" id="coupleMeta">Alex &amp; Jordan</p>
    </header>

    <div class="vinyl-stage">
      <div class="vinyl-wrap">
        <div class="vinyl-shadow"></div>
        <div class="tonearm" id="tonearm">
          <div class="tonearm-pivot"></div>
          <div class="tonearm-arm">
            <div class="tonearm-head"></div>
          </div>
        </div>
        <div class="vinyl" id="vinyl">
          <div class="label">
            <div class="label-art" id="labelArt">OS</div>
            <div class="label-hole"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="waveform-wrap">
      <div class="waveform" id="waveform" aria-hidden="true">
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
        <span class="waveform-bar"></span><span class="waveform-bar"></span>
      </div>
    </div>

    <div class="track-info">
      <p class="track-num" id="trackNum">Track 01</p>
      <h3 class="track-title" id="trackTitle">First Dance</h3>
      <p class="track-memory" id="trackMemory"></p>
      <p class="track-lyrics" id="trackLyrics"></p>
      <button class="lyrics-toggle" id="lyricsToggle" type="button" hidden>Show Lyrics</button>
    </div>

    <div class="player">
      <div class="progress-wrap">
        <span id="timeCurrent">0:00</span>
        <div class="progress-bar" id="progressBar" role="slider" aria-label="Seek" tabindex="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="timeTotal">3:42</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn skip-btn" id="prevBtn" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" type="button" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn skip-btn" id="nextBtn" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2v12zm-11-7 8.5-6v12L5 11z"/></svg>
        </button>
      </div>
    </div>

    <div class="tracklist" id="tracklist">
      <button class="tracklist-toggle" id="tracklistToggle" type="button">
        Tracklist
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
      </button>
      <div class="tracklist-inner" id="tracklistInner"></div>
    </div>
  </main>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ========== EXPERIENCE CONFIG ========== */
const EXPERIENCE = {
  couple: 'Alex & Jordan',
  albumTitle: 'Our Soundtrack',
  tracks: [
    {
      title: 'First Glance',
      memory: 'The night we met at that tiny jazz bar — you laughed at my terrible drink order and I knew.',
      lyrics: '"I saw you there, heart on my sleeve…"\nEvery chorus still takes me back to that corner booth.',
      audioSrc: '',
      duration: 222,
    },
    {
      title: 'Late Night Drives',
      memory: 'Windows down, city lights blurring. Your playlist, my hand on the gear shift, your hand on mine.',
      lyrics: '"City lights fade but you stay bright…"\nWe must have circled the block a dozen times.',
      audioSrc: '',
      duration: 198,
    },
    {
      title: 'Kitchen Dancing',
      memory: 'Sunday mornings in slippers, spatula microphone, flour on your nose. Our silliest, truest song.',
      lyrics: '"Spin me slow in the morning sun…"\nNo stage could ever top our linoleum floor.',
      audioSrc: '',
      duration: 245,
    },
    {
      title: 'Under the Stars',
      memory: 'That rooftop in December. You pointed at Orion and said our constellation was still being written.',
      lyrics: '"Write our names across the sky…"\nI believed you. I still do.',
      audioSrc: '',
      duration: 267,
    },
    {
      title: 'Forever Side B',
      memory: 'Not an ending — a flip of the record. Side B is everything still to come.',
      lyrics: '"Flip the vinyl, press play again…"\nOur soundtrack never really stops.',
      audioSrc: '',
      duration: 312,
    },
  ],
};

/* ========== DOM ========== */
const $ = (id) => document.getElementById(id);
const intro = $('intro');
const main = $('main');
const vinyl = $('vinyl');
const tonearm = $('tonearm');
const waveform = $('waveform');
const glow = $('glow');
const audio = $('audio');
const playBtn = $('playBtn');
const playIcon = $('playIcon');
const pauseIcon = $('pauseIcon');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const progressBar = $('progressBar');
const progressFill = $('progressFill');
const timeCurrent = $('timeCurrent');
const timeTotal = $('timeTotal');
const trackNum = $('trackNum');
const trackTitle = $('trackTitle');
const trackMemory = $('trackMemory');
const trackLyrics = $('trackLyrics');
const lyricsToggle = $('lyricsToggle');
const tracklist = $('tracklist');
const tracklistInner = $('tracklistInner');
const tracklistToggle = $('tracklistToggle');

let currentIndex = 0;
let isPlaying = false;
let lyricsOpen = false;
let progressTimer = null;
let simulatedElapsed = 0;
let usingAudio = false;

/* ========== Init ========== */
function init() {
  document.title = EXPERIENCE.albumTitle + ' · Romantic';
  $('introTitle').textContent = EXPERIENCE.albumTitle;
  $('introCouple').textContent = EXPERIENCE.couple;
  $('albumTitle').textContent = EXPERIENCE.albumTitle;
  $('coupleMeta').textContent = EXPERIENCE.couple;

  const initials = EXPERIENCE.albumTitle
    .split(/\s+/)
    .map((w) => w[0])
    .join('')
    .slice(0, 3)
    .toUpperCase();
  $('labelArt').textContent = initials;

  buildTracklist();
  loadTrack(0, false);
}

function buildTracklist() {
  tracklistInner.innerHTML = '';
  EXPERIENCE.tracks.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'track-item' + (i === 0 ? ' active' : '');
    btn.dataset.index = i;
    btn.innerHTML =
      '<span class="track-item-num">' + pad(i + 1) + '</span>' +
      '<span class="track-item-playing" aria-hidden="true">' +
        '<span class="mini-bar"></span><span class="mini-bar"></span><span class="mini-bar"></span>' +
      '</span>' +
      '<span class="track-item-title">' + escapeHtml(t.title) + '</span>' +
      '<span class="track-item-dur">' + formatTime(t.duration || 180) + '</span>';
    btn.addEventListener('click', () => selectTrack(i));
    tracklistInner.appendChild(btn);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function pad(n) {
  return n < 10 ? '0' + n : '' + n;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* ========== Track loading ========== */
function loadTrack(index, autoplay) {
  currentIndex = index;
  const track = EXPERIENCE.tracks[index];

  trackNum.textContent = 'Track ' + pad(index + 1);
  trackTitle.textContent = track.title;
  trackMemory.textContent = track.memory;
  trackMemory.classList.remove('expanded');

  if (track.lyrics) {
    trackLyrics.textContent = track.lyrics.replace(/\\n/g, '\n');
    lyricsToggle.hidden = false;
    lyricsToggle.textContent = 'Show Lyrics';
    trackLyrics.classList.remove('visible');
    lyricsOpen = false;
  } else {
    trackLyrics.textContent = '';
    lyricsToggle.hidden = true;
    trackLyrics.classList.remove('visible');
    lyricsOpen = false;
  }

  const dur = track.duration || 180;
  timeTotal.textContent = formatTime(dur);
  simulatedElapsed = 0;
  updateProgress(0);

  document.querySelectorAll('.track-item').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  usingAudio = !!(track.audioSrc && track.audioSrc.trim());
  audio.pause();
  if (usingAudio) {
    audio.src = track.audioSrc;
    audio.load();
  } else {
    audio.removeAttribute('src');
  }

  if (autoplay) play();
  else pause(false);
}

function selectTrack(index) {
  if (index === currentIndex) return;
  loadTrack(index, isPlaying);
}

/* ========== Playback ========== */
function play() {
  isPlaying = true;
  vinyl.classList.add('playing');
  tonearm.classList.add('playing');
  waveform.classList.add('active');
  glow.classList.add('playing');
  playIcon.hidden = true;
  pauseIcon.hidden = false;
  playBtn.setAttribute('aria-label', 'Pause');

  if (usingAudio) {
    audio.play().catch(() => {});
    startAudioProgress();
  } else {
    startSimulatedProgress();
  }
}

function pause(resetArm) {
  isPlaying = false;
  vinyl.classList.remove('playing');
  if (resetArm !== false) {
    tonearm.classList.remove('playing');
  }
  waveform.classList.remove('active');
  glow.classList.remove('playing');
  playIcon.hidden = false;
  pauseIcon.hidden = true;
  playBtn.setAttribute('aria-label', 'Play');

  audio.pause();
  stopProgress();
}

function togglePlay() {
  if (isPlaying) pause();
  else play();
}

function prevTrack() {
  const idx = currentIndex > 0 ? currentIndex - 1 : EXPERIENCE.tracks.length - 1;
  loadTrack(idx, isPlaying);
}

function nextTrack() {
  const idx = currentIndex < EXPERIENCE.tracks.length - 1 ? currentIndex + 1 : 0;
  loadTrack(idx, isPlaying);
}

function startSimulatedProgress() {
  stopProgress();
  const dur = EXPERIENCE.tracks[currentIndex].duration || 180;
  progressTimer = setInterval(() => {
    simulatedElapsed += 0.25;
    if (simulatedElapsed >= dur) {
      simulatedElapsed = 0;
      nextTrack();
      return;
    }
    updateProgress(simulatedElapsed / dur);
    timeCurrent.textContent = formatTime(simulatedElapsed);
  }, 250);
}

function startAudioProgress() {
  stopProgress();
  progressTimer = setInterval(() => {
    if (!audio.duration) return;
    updateProgress(audio.currentTime / audio.duration);
    timeCurrent.textContent = formatTime(audio.currentTime);
  }, 200);
}

function stopProgress() {
  if (progressTimer) {
    clearInterval(progressTimer);
    progressTimer = null;
  }
}

function updateProgress(ratio) {
  progressFill.style.width = Math.min(100, Math.max(0, ratio * 100)) + '%';
}

function seek(ratio) {
  const track = EXPERIENCE.tracks[currentIndex];
  const dur = usingAudio ? audio.duration : (track.duration || 180);
  const t = ratio * dur;
  if (usingAudio && audio.duration) {
    audio.currentTime = t;
  } else {
    simulatedElapsed = t;
    timeCurrent.textContent = formatTime(t);
  }
  updateProgress(ratio);
}

/* ========== Events ========== */
function enterExperience() {
  intro.classList.add('hidden');
  main.classList.add('visible');
}

$('introBtn').addEventListener('click', enterExperience);
intro.addEventListener('click', (e) => {
  if (e.target === $('introBtn')) return;
  enterExperience();
});

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);

lyricsToggle.addEventListener('click', () => {
  lyricsOpen = !lyricsOpen;
  trackLyrics.classList.toggle('visible', lyricsOpen);
  trackMemory.classList.toggle('expanded', lyricsOpen);
  lyricsToggle.textContent = lyricsOpen ? 'Hide Lyrics' : 'Show Lyrics';
});

tracklistToggle.addEventListener('click', () => {
  tracklist.classList.toggle('open');
});

progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  seek(Math.max(0, Math.min(1, ratio)));
});

progressBar.addEventListener('keydown', (e) => {
  const track = EXPERIENCE.tracks[currentIndex];
  const dur = usingAudio ? (audio.duration || 1) : (track.duration || 180);
  const step = 5 / dur;
  let ratio = (usingAudio ? audio.currentTime : simulatedElapsed) / dur;
  if (e.key === 'ArrowRight') ratio = Math.min(1, ratio + step);
  else if (e.key === 'ArrowLeft') ratio = Math.max(0, ratio - step);
  else return;
  e.preventDefault();
  seek(ratio);
});

audio.addEventListener('ended', () => nextTrack());

audio.addEventListener('loadedmetadata', () => {
  if (usingAudio) timeTotal.textContent = formatTime(audio.duration);
});

init();
</script>
</body>
</html>
