<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap');

  :root{
    --bg1:#1a0510;--bg2:#2d0a1e;--accent:#e8507a;--accent2:#f9c6d4;--gold:#d4a853;
    --glass-fill:rgba(255,255,255,.08);--glass-fill-strong:rgba(255,255,255,.14);
    --glass-border:rgba(255,255,255,.20);--glass-border-soft:rgba(255,255,255,.12);
    --text-light:#fff5f8;--text-muted:rgba(255,245,248,.55);
    --ease-smooth:cubic-bezier(.22,1,.36,1);--ease-turn:cubic-bezier(.645,.045,.355,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 18% 18%,rgba(232,80,122,.13),transparent 27%),
      radial-gradient(circle at 82% 78%,rgba(212,168,83,.08),transparent 25%),
      radial-gradient(ellipse at 50% 35%,#24101d 0%,#11070e 58%,#070308 100%);
    font-family:'Jost',sans-serif;display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.45) 100%);
    
  }
  @keyframes vignetteBreath{0%,100%{opacity:.85;}50%{opacity:1;}}
  .bokeh{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .bok{position:absolute;border-radius:50%;filter:blur(40px);opacity:.14;animation:drift linear infinite;}
  @keyframes drift{0%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-20px) scale(1.1);}100%{transform:translate(0,0) scale(1);}}
  .ambient{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .ambient-item{
    position:absolute;top:-8%;opacity:0;
    animation:ambientFall linear infinite;
    filter:drop-shadow(0 0 6px rgba(232,80,122,.25));
  }
  @keyframes ambientFall{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
    8%{opacity:.55;}85%{opacity:.35;}
    100%{transform:translateY(115vh) translateX(var(--drift,20px)) rotate(320deg);opacity:0;}
  }
  .glass{
    background:linear-gradient(145deg,var(--glass-fill-strong),var(--glass-fill) 55%,rgba(232,80,122,.05)),rgba(40,8,24,.42);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05);
  }
  .stage{
    width:min(370px,92vw);height:min(590px,90vh);
    position:relative;z-index:10;perspective:1900px;perspective-origin:50% 40%;
    transform-style:preserve-3d;transition:transform .55s var(--ease-smooth);
  }
  .stage.looping{transform:scale(.96);}
  .stage::after{
    content:"";position:absolute;left:50%;bottom:2%;width:75%;height:38px;
    transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.5);
    filter:blur(22px);transition:all 1.3s var(--ease-smooth);
  }
  .stage.opened::after{width:48%;opacity:.45;height:28px;bottom:4%;}
  .bloom{
    position:absolute;left:50%;top:42%;width:180px;height:180px;
    transform:translate(-50%,-50%) scale(.4);border-radius:50%;
    background:radial-gradient(circle,rgba(249,198,212,.55),rgba(232,80,122,.2) 40%,transparent 70%);
    opacity:0;pointer-events:none;z-index:25;filter:blur(8px);
  }
  .stage.blooming .bloom{animation:bloomFlash 1.1s var(--ease-smooth) forwards;}
  @keyframes bloomFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.35);}35%{opacity:.9;transform:translate(-50%,-50%) scale(1.15);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6);}}
  .envelope{
    position:absolute;width:min(350px,86vw);height:min(235px,50vw);
    left:50%;bottom:17%;transform:translateX(-50%);
    transform-style:preserve-3d;z-index:20;cursor:pointer;
    transition:transform 1.1s var(--ease-smooth),filter 1s ease,opacity .7s ease;
    animation:envelopeIdle 3.4s ease-in-out infinite;
  }
  @keyframes envelopeIdle{0%,100%{transform:translateX(-50%) rotate(-.4deg);}50%{transform:translateX(-50%) rotate(.5deg) translateY(-2px);}}
  .envelope-shell{position:absolute;inset:0;border-radius:22px;overflow:hidden;}
  .envelope-shell::before{
    content:"";position:absolute;inset:-90% -40%;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);
    transform:translateX(-60%) rotate(8deg);
    pointer-events:none;z-index:5;opacity:0;
  }
  @keyframes shellSweep{0%{transform:translateX(-70%) rotate(8deg);opacity:0;}15%{opacity:1;}55%{transform:translateX(70%) rotate(8deg);opacity:.7;}100%{transform:translateX(80%) rotate(8deg);opacity:0;}}
  .stage.opened .envelope-shell::before{animation:none;opacity:0;}
  .envelope-shell::after{
    content:"";position:absolute;inset:-80% -30%;
    background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.13) 49%,transparent 59%);
    transform:translateX(-45%) rotate(8deg);transition:transform 1.4s var(--ease-smooth);pointer-events:none;
  }
  .stage.opened .envelope-shell::after{transform:translateX(45%) rotate(8deg);}
  .stage.opened .envelope{
    animation:none;transform:translateX(-50%) translateY(22px) scale(.93);
    opacity:0;filter:blur(6px);pointer-events:none;
    transition:transform .85s var(--ease-smooth),opacity .65s ease .1s,filter .65s ease .1s;
  }
  .fold{position:absolute;z-index:2;pointer-events:none;}
  .fold.left{left:0;bottom:0;width:0;height:0;border-top:118px solid transparent;border-right:175px solid rgba(255,255,255,.045);}
  .fold.right{right:0;bottom:0;width:0;height:0;border-top:118px solid transparent;border-left:175px solid rgba(255,255,255,.045);}
  .fold.bottom{left:0;bottom:0;width:0;height:0;border-left:175px solid transparent;border-right:175px solid transparent;border-bottom:123px solid rgba(255,255,255,.055);}
  .envelope-flap{
    position:absolute;inset:0 0 auto;height:100%;z-index:35;
    transform-origin:50% 0%;transform:rotateX(0deg);transform-style:preserve-3d;
    clip-path:polygon(0 0,100% 0,50% 63%);border-top:1px solid rgba(255,255,255,.24);
    background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.03)),linear-gradient(145deg,rgba(96,17,55,.82),rgba(24,4,16,.86));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 15px 30px rgba(0,0,0,.22);
    transition:transform 1.05s var(--ease-turn),filter .9s ease;will-change:transform;
  }
  .envelope-flap::after{content:"";position:absolute;inset:0;clip-path:inherit;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 43%,rgba(232,80,122,.08));}
  .stage.opened .envelope-flap{transform:rotateX(-178deg);filter:brightness(.84);}
  .flap-sparks{position:absolute;left:50%;top:8%;width:1px;height:1px;z-index:45;pointer-events:none;}
  .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold),0 0 14px rgba(232,80,122,.6);opacity:0;}
  .stage.opened .spark{animation:sparkFly .9s var(--ease-smooth) forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.2);}}
  .envelope-prompt{
    position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);z-index:40;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-family:'Jost',sans-serif;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--text-muted);pointer-events:none;
    animation:promptPulse 2.6s ease-in-out infinite;transition:opacity .45s ease;
  }
  .envelope-prompt .seal{
    position:relative;width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--accent2);
    background:radial-gradient(circle at 35% 30%,rgba(232,80,122,.65),rgba(120,20,60,.55) 70%);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 6px 16px rgba(232,80,122,.4),inset 0 1px 0 rgba(255,255,255,.4);overflow:hidden;
  }
  .seal .seal-icon{position:relative;z-index:2;transition:opacity .2s ease;}
  .seal::before,.seal::after{content:"";position:absolute;inset:0;background:inherit;border-radius:50%;opacity:0;}
  .envelope-prompt.cracking{animation:none;}
  .envelope-prompt.cracking .seal{background:transparent;border-color:transparent;box-shadow:none;}
  .envelope-prompt.cracking .seal-icon{opacity:0;}
  .envelope-prompt.cracking .seal::before,.envelope-prompt.cracking .seal::after{opacity:1;background:radial-gradient(circle at 35% 30%,rgba(232,80,122,.65),rgba(120,20,60,.55) 70%);border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 16px rgba(232,80,122,.35);}
  .envelope-prompt.cracking .seal::before{clip-path:polygon(0 0,48% 0,42% 100%,0 100%);animation:sealSplitL .55s var(--ease-smooth) forwards;}
  .envelope-prompt.cracking .seal::after{clip-path:polygon(52% 0,100% 0,100% 100%,58% 100%);animation:sealSplitR .55s var(--ease-smooth) forwards;}
  @keyframes sealSplitL{0%{transform:translate(0,0) rotate(0);opacity:1;}100%{transform:translate(-18px,10px) rotate(-28deg);opacity:0;}}
  @keyframes sealSplitR{0%{transform:translate(0,0) rotate(0);opacity:1;}100%{transform:translate(18px,12px) rotate(26deg);opacity:0;}}
  .stage.opened .envelope-prompt{opacity:0;}
  @keyframes promptPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85;}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1;}}
  .card-emerge{
    position:absolute;width:min(335px,82vw);height:min(470px,71vh);
    left:50%;bottom:calc(17% + 4px);
    transform:translate3d(-50%,140px,-40px) rotateX(10deg) scale(.72);
    transform-style:preserve-3d;opacity:0;z-index:30;pointer-events:none;
    clip-path:inset(0 0 0 0 round 24px);
    transition:transform 1.3s var(--ease-smooth),opacity .6s ease;will-change:transform,opacity;
  }
  .stage:not(.opened) .card-emerge{clip-path:inset(72% 0 0 0 round 24px);}
  .stage.opened .card-emerge{
    transform:translate3d(-50%,-24px,80px) rotateX(0deg) scale(1);opacity:1;
    clip-path:inset(0 0 0 0 round 24px);pointer-events:auto;
    transition:transform 1.3s var(--ease-smooth) .5s,opacity .55s ease .5s,clip-path 1.3s var(--ease-smooth) .5s;
  }
  .stage.opened .card-emerge:hover{transform:translate3d(-50%,-31px,88px) scale(1.012);}
  .card-3d{
    width:100%;height:100%;position:relative;transform-style:preserve-3d;
    filter:drop-shadow(0 18px 18px rgba(0,0,0,.28));
    transition:filter 1.3s var(--ease-smooth) .5s,transform .35s var(--ease-smooth);will-change:transform;
  }
  .stage.opened .card-3d{filter:drop-shadow(0 38px 42px rgba(0,0,0,.48));}
  .card-3d::before{
    content:"";position:absolute;left:8%;right:8%;top:-3px;height:6px;
    border-radius:6px 6px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04));
    opacity:0;transition:opacity .8s ease .9s;z-index:2;pointer-events:none;
  }
  .stage.opened .card-3d::before{opacity:1;}
  .card-open{position:absolute;inset:0;border-radius:24px;outline:1px solid rgba(249,198,212,.12);overflow:hidden;box-shadow:0 38px 85px rgba(0,0,0,.52),0 12px 35px rgba(232,80,122,.08);}
  .glass-inner{height:100%;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .glass-inner::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 5%,rgba(255,245,248,.16),transparent 25%),linear-gradient(120deg,rgba(255,255,255,.07),transparent 35%,rgba(232,80,122,.025) 72%);z-index:10;}
  
  
  .inner-top{padding:18px 22px 13px;border-bottom:1px solid var(--glass-border-soft);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:25;}
  .inner-occasion{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:var(--accent2);letter-spacing:.02em;}
  .inner-dots{display:flex;gap:6px;}
  .inner-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);transition:all .4s var(--ease-smooth);cursor:pointer;}
  .inner-dot.active{background:var(--accent);border-color:rgba(255,255,255,.4);transform:scale(1.4);box-shadow:0 0 10px rgba(232,80,122,.45);}
  .inner-nav{padding:12px 22px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--glass-border-soft);flex-shrink:0;position:relative;z-index:25;}
  .nav-from{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.85rem;color:var(--text-muted);}
  .nav-btn{background:rgba(255,255,255,.05);border:1px solid var(--glass-border-soft);color:var(--text-muted);font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.1em;padding:7px 16px;border-radius:99px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent;transition:transform .3s var(--ease-smooth),background .3s ease,border-color .3s ease,color .3s ease,box-shadow .4s ease;}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(232,80,122,.08);transform:translateY(-2px);}
  .nav-btn:active{transform:translateY(0) scale(.96);}
  .nav-btn:disabled{opacity:.18;cursor:default;border-color:rgba(255,255,255,.06);transform:none;}
  .nav-btn.finale{border-color:var(--accent);color:var(--accent2);background:rgba(232,80,122,.16);box-shadow:0 0 18px rgba(232,80,122,.35);animation:btnBloom 1.6s ease-in-out infinite;}
  @keyframes btnBloom{0%,100%{box-shadow:0 0 10px rgba(232,80,122,.25);transform:scale(1);}50%{box-shadow:0 0 22px rgba(232,80,122,.5);transform:scale(1.04);}}
  .pages-wrap{flex:1;position:relative;perspective:1500px;perspective-origin:0% 50%;}
  .leaf{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0% 50%;transform:rotateY(0deg) translateZ(0px);transition:transform .85s var(--ease-turn);will-change:transform;}
  .leaf-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 22px 18px;}
  .leaf-front{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 48%,rgba(232,80,122,.04)),linear-gradient(160deg,#4a1230,#2c0a1c 55%,#1a0511);}
  .leaf-back{transform:rotateY(180deg);background:linear-gradient(215deg,rgba(255,255,255,.08),rgba(255,255,255,.015) 50%,rgba(212,168,83,.04)),linear-gradient(200deg,#3c0e26,#200716);display:flex;align-items:center;justify-content:center;}
  .leaf-back-deco{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.9rem;color:rgba(249,198,212,.22);letter-spacing:.08em;text-align:center;}
  .leaf-front::before,.leaf-back::before{content:"";position:absolute;inset:0;left:0;width:46px;background:linear-gradient(90deg,rgba(0,0,0,.30),transparent);pointer-events:none;}
  .leaf-back::before{background:linear-gradient(90deg,rgba(0,0,0,.38),transparent);}
  .leaf-front::after{content:"";position:absolute;right:0;bottom:0;width:28px;height:28px;background:linear-gradient(225deg,transparent 48%,rgba(255,255,255,.08) 50%,rgba(0,0,0,.18));box-shadow:-2px -2px 8px rgba(0,0,0,.15);opacity:0;transition:opacity .5s ease;pointer-events:none;}
  .leaf.is-active .leaf-front::after{opacity:1;animation:curlNudge 2.4s ease-in-out infinite;}
  @keyframes curlNudge{0%,100%{transform:translate(0,0);}50%{transform:translate(-2px,-2px);}}
  .leaf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),transparent 55%);opacity:0;transition:opacity .95s var(--ease-turn);pointer-events:none;z-index:5;}
  .leaf.mid-turn::after{opacity:1;}
  .leaf.entering .page-label,.leaf.entering .page-title,.leaf.entering .page-body,.leaf.entering .glass-box{animation:textIn .38s var(--ease-smooth) both;}
  .leaf.entering .page-label{animation-delay:0s;}.leaf.entering .page-title{animation-delay:.04s;}.leaf.entering .page-body{animation-delay:.08s;}.leaf.entering .glass-box{animation-delay:.12s;}
  @keyframes textIn{from{transform:translateY(6px);opacity:.72;}to{transform:none;opacity:1;}}
  .page-label{font-family:'Jost',sans-serif;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
  .page-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.7rem;color:var(--text-light);line-height:1.25;}
  .page-body{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--text-muted);line-height:1.65;}
  .glass-box{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--glass-border-soft);border-radius:12px;padding:13px 15px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.97rem;color:var(--text-light);line-height:1.7;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 22px rgba(0,0,0,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .leaf.entering .glass-box.pulse{animation:textIn .38s var(--ease-smooth) .12s both,boxGlow 1.2s ease .35s;}
  @keyframes boxGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 22px rgba(0,0,0,.08);}40%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 22px rgba(232,80,122,.3),0 8px 22px rgba(0,0,0,.08);border-color:rgba(232,80,122,.4);}}
  @media(max-width:600px){
    .stage{width:100vw;height:100vh;}
    .envelope{width:80vw;height:51vw;bottom:15%;}
    .fold.left,.fold.right{border-top-width:25vw;}
    .fold.left{border-right-width:40vw;}.fold.right{border-left-width:40vw;}
    .fold.bottom{border-left-width:40vw;border-right-width:40vw;border-bottom-width:26vw;}
    .card-emerge{width:min(84vw,335px);height:min(68vh,470px);bottom:calc(15% + 3px);}
    .stage.opened .card-emerge{transform:translate3d(-50%,-18px,65px) rotateX(0deg) scale(1);}
  }
  @media(prefers-reduced-motion:reduce){
    .envelope,.envelope-flap,.card-emerge,.leaf,.leaf::after,
    .heart-particle,.confetti,.bok,.envelope-prompt,
    .ambient-item,.bloom,.spark,.card-3d,body::before,.nav-btn.finale{animation:none!important;transition:none!important;}
    .leaf.entering .page-label,.leaf.entering .page-title,.leaf.entering .page-body,.leaf.entering .glass-box{animation:none!important;opacity:1!important;transform:none!important;}
  }
  .heart-particle{position:fixed;pointer-events:none;z-index:199;font-size:1.1rem;animation:heartRise ease-out forwards;}
  @keyframes heartRise{0%{opacity:1;transform:translateY(0) scale(.5) rotate(-15deg);}60%{opacity:.9;transform:translateY(-110px) scale(1) rotate(10deg);}100%{opacity:0;transform:translateY(-190px) scale(.7) rotate(-5deg);}}
  .confetti{position:fixed;top:-10px;pointer-events:none;z-index:201;animation:cfetti linear forwards;}
  @keyframes cfetti{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}
  .finale-heart{position:fixed;top:-20px;pointer-events:none;z-index:200;font-size:1.2rem;animation:finaleFall linear forwards;}
  @keyframes finaleFall{0%{transform:translateY(0) rotate(0deg);opacity:0;}10%{opacity:1;}100%{transform:translateY(110vh) rotate(280deg);opacity:0;}}
</style>
</head>
<body>
<div class="bokeh">
  <div class="bok" style="width:280px;height:280px;background:#e8507a;top:5%;left:10%;animation-duration:12s;"></div>
  <div class="bok" style="width:200px;height:200px;background:#9b2a5c;bottom:10%;right:8%;animation-duration:9s;animation-delay:3s;"></div>
  <div class="bok" style="width:160px;height:160px;background:#d4a853;top:50%;left:50%;animation-duration:15s;animation-delay:6s;opacity:.1;"></div>
</div>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="stage" id="stage">
  <div class="bloom" id="bloom" aria-hidden="true"></div>
  <div class="envelope glass" id="envelope" role="button" tabindex="0" aria-label="Envelope, tap to open">
    <div class="envelope-shell">
      <div class="fold left"></div><div class="fold right"></div><div class="fold bottom"></div>
    </div>
    <div class="envelope-flap"></div>
    <div class="flap-sparks" id="flapSparks" aria-hidden="true"></div>
    <div class="envelope-prompt" id="envelopePrompt">
      <div class="seal"><span class="seal-icon" id="sealIcon">✦</span></div>
      <span id="promptText">Tap to open</span>
    </div>
  </div>
  <div class="card-emerge" id="cardEmerge">
    <div class="card-3d" id="card3d">
      <div class="card-open glass" id="cardOpen">
        <div class="glass-inner">
          <div class="inner-top">
            <div class="inner-occasion" id="innerOccasion"></div>
            <div class="inner-dots" id="innerDots"></div>
          </div>
          <div class="pages-wrap" id="pagesWrap"></div>
          <div class="inner-nav">
            <button class="nav-btn" id="prevBtn">← Back</button>
            <div class="nav-from" id="navFrom"></div>
            <button class="nav-btn" id="nextBtn">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
/* =============================================
   TEMPLATE CONFIG — only edit this block
   ============================================= */
const CARD = {
  occasion:   'For You',
  promptLabel:'Tap to open',
  seal:       '✦',
  from:       '— Yu',
  particles:  ['❤️','🌹','💕','✨','💗'],
  pages: [
    { label:'I know', title:'I messed up.', body:'I\'ve been thinking about it every single day. There\'s no excuse and I\'m not going to give you one.', box:null },
    { label:'What I feel', title:'You matter to me.', body:'More than I showed. More than I said. That\'s on me — and I won\'t pretend otherwise.', box:'I\'d rather have you mad at me than lose you quietly.' },
    { label:'What I\'m asking', title:'Just one chance.', body:'Not to fix everything overnight. Just a chance to show you I actually mean it this time.', box:null }
  ]
};
/* ============================================= */
const stage=document.getElementById('stage'),envelope=document.getElementById('envelope'),pagesWrap=document.getElementById('pagesWrap'),dotsEl=document.getElementById('innerDots'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),card3d=document.getElementById('card3d'),cardEmerge=document.getElementById('cardEmerge'),promptEl=document.getElementById('envelopePrompt');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('innerOccasion').textContent=CARD.occasion;
document.getElementById('navFrom').textContent=CARD.from;
document.getElementById('promptText').textContent=CARD.promptLabel||'Tap to open';
document.getElementById('sealIcon').textContent=CARD.seal||'✦';
const total=CARD.pages.length;
let current=0,opened=false,opening=false,animating=false,finaleDone=false;
CARD.pages.forEach((p,i)=>{
  const leaf=document.createElement('div');
  leaf.className='leaf'+(i===0?' is-active':'');leaf.dataset.i=i;
  leaf.innerHTML=`<div class="leaf-face leaf-front"><div class="page-label">${p.label}</div><div class="page-title">${p.title}</div><div class="page-body">${p.body}</div>${p.box?`<div class="glass-box">${p.box}</div>`:''}</div><div class="leaf-face leaf-back"><div class="leaf-back-deco">${CARD.seal||'✦'}</div></div>`;
  pagesWrap.appendChild(leaf);
  const dot=document.createElement('div');
  dot.className='inner-dot'+(i===0?' active':'');
  dot.addEventListener('click',e=>{e.stopPropagation();goTo(i);});
  dotsEl.appendChild(dot);
});
const leaves=pagesWrap.querySelectorAll('.leaf'),dots=dotsEl.querySelectorAll('.inner-dot');
const TURNED_Z=-8,STEP_Z=4;
function layoutLeaves(){
  leaves.forEach((leaf,i)=>{
    leaf.classList.remove('mid-turn');leaf.classList.toggle('is-active',i===current);
    if(i<current){leaf.style.transform=`rotateY(-178deg) translateZ(${TURNED_Z}px)`;leaf.style.zIndex=i;leaf.style.pointerEvents='none';}
    else{const depth=(i-current)*STEP_Z;leaf.style.transform=`rotateY(0deg) translateZ(${-depth}px)`;leaf.style.zIndex=(total-i)+100;leaf.style.pointerEvents=(i===current)?'auto':'none';}
  });
  if(opened)playPageEnter();
}
function playPageEnter(){
  const leaf=leaves[current];if(!leaf||reduceMotion)return;
  leaf.classList.remove('entering');const box=leaf.querySelector('.glass-box');if(box)box.classList.remove('pulse');
  void leaf.offsetWidth;leaf.classList.add('entering');if(box)box.classList.add('pulse');
  clearTimeout(playPageEnter._t);playPageEnter._t=setTimeout(()=>leaf.classList.remove('entering'),500);
}
layoutLeaves();prevBtn.disabled=true;updateNavLabel();
function turnForward(i,cb){const leaf=leaves[i];leaf.style.zIndex=999;leaf.classList.add('mid-turn');requestAnimationFrame(()=>{leaf.style.transform=`rotateY(-178deg) translateZ(${TURNED_Z}px)`;});setTimeout(()=>{if(cb)cb();},950);}
function turnBackward(i,cb){const leaf=leaves[i];leaf.style.zIndex=999;leaf.classList.add('mid-turn');requestAnimationFrame(()=>{leaf.style.transform=`rotateY(0deg) translateZ(0px)`;});setTimeout(()=>{if(cb)cb();},950);}
function goTo(target){
  if(animating||target===current||target<0||target>=total)return;
  animating=true;const dir=target>current?1:-1;
  function step(){
    if(current===target){animating=false;layoutLeaves();syncUI();return;}
    if(dir===1){const i=current;turnForward(i,()=>{current=i+1;layoutLeaves();step();});}
    else{const i=current-1;turnBackward(i,()=>{current=i;layoutLeaves();step();});}
  }
  step();
}
function loopToStart(){
  if(animating)return;animating=true;finaleDone=false;stage.classList.add('looping');
  const inner=document.querySelector('.glass-inner');inner.style.transition='opacity .32s ease';inner.style.opacity='0';
  setTimeout(()=>{current=0;layoutLeaves();inner.style.opacity='1';stage.classList.remove('looping');animating=false;syncUI();},330);
}
function advance(){if(animating)return;if(current<total-1)goTo(current+1);else loopToStart();}
function syncUI(){
  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
  prevBtn.disabled=current===0;nextBtn.disabled=false;
  const last=current===total-1;nextBtn.textContent=last?'Again ↻':'Next →';nextBtn.classList.toggle('finale',last);
  updateNavLabel();if(last&&opened&&!finaleDone){finaleDone=true;launchFinale();}
}
function updateNavLabel(){document.getElementById('navFrom').textContent=CARD.from;}
prevBtn.addEventListener('click',e=>{e.stopPropagation();if(current>0)goTo(current-1);});
nextBtn.addEventListener('click',e=>{e.stopPropagation();advance();});
envelope.addEventListener('click',openEnvelope);
envelope.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnvelope();}});
function openEnvelope(){
  if(opened||opening)return;opening=true;promptEl.classList.add('cracking');
  setTimeout(()=>{stage.classList.add('opened');spawnFlapSparks();setTimeout(()=>stage.classList.add('blooming'),480);},reduceMotion?0:320);
  setTimeout(()=>{opened=true;opening=false;launchConfetti();playPageEnter();},reduceMotion?200:1850);
}
function spawnFlapSparks(){
  const host=document.getElementById('flapSparks');host.innerHTML='';
  for(let i=0;i<12;i++){
    const s=document.createElement('div');s.className='spark';
    const angle=(Math.PI*1.2)*(i/11)-Math.PI*.1,dist=40+Math.random()*70;
    s.style.setProperty('--sx',Math.cos(angle)*dist+'px');s.style.setProperty('--sy',Math.sin(angle)*dist-20+'px');
    s.style.animationDelay=(Math.random()*.25)+'s';
    s.style.background=Math.random()>.45?'var(--gold)':'var(--accent2)';
    host.appendChild(s);
  }
}
cardEmerge.addEventListener('click',e=>{if(!opened||animating)return;if(e.target.closest('.nav-btn')||e.target.closest('.inner-dot'))return;advance();});
document.addEventListener('click',e=>{
  if(!opened||animating)return;if(e.target.closest('.nav-btn')||e.target.closest('.inner-dot'))return;
  spawnHearts(e.clientX,e.clientY,3);
  if(current===total-1&&!e.target.closest('#cardEmerge')&&!e.target.closest('#envelope'))advance();
});
function spawnHearts(x,y,n){
  const emojis=CARD.particles||['❤️','✨'];
  for(let i=0;i<n;i++){
    const h=document.createElement('div');h.className='heart-particle';h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=(x+(Math.random()-.5)*60)+'px';h.style.top=y+'px';
    h.style.animationDuration=(.8+Math.random()*.6)+'s';h.style.animationDelay=(Math.random()*.2)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),1400);
  }
}
function launchConfetti(){
  const colors=['#e8507a','#f9c6d4','#d4a853','#fff5f8','#9b2a5c'];
  for(let i=0;i<55;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.width=(5+Math.random()*6)+'px';c.style.height=(8+Math.random()*8)+'px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.style.animationDuration=(1.8+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),3400);
  }
}
function launchFinale(){
  launchConfetti();const emojis=CARD.particles||['❤️','✨'];
  for(let i=0;i<28;i++){
    const h=document.createElement('div');h.className='finale-heart';h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=Math.random()*100+'vw';h.style.fontSize=(.9+Math.random()*.9)+'rem';
    h.style.animationDuration=(2.2+Math.random()*1.8)+'s';h.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),4200);
  }
}
const ambientHost=document.getElementById('ambient');
if(!reduceMotion){
  const pool=CARD.particles||['✨'];
  for(let i=0;i<4;i++){
    const el=document.createElement('div');el.className='ambient-item';el.textContent=pool[Math.floor(Math.random()*pool.length)];
    el.style.left=Math.random()*100+'vw';el.style.fontSize=(.7+Math.random()*.85)+'rem';
    el.style.setProperty('--drift',(Math.random()*80-40)+'px');
    el.style.animationDuration=(11+Math.random()*12)+'s';el.style.animationDelay=(Math.random()*14)+'s';
    ambientHost.appendChild(el);
  }
}
if(!reduceMotion&&matchMedia('(hover:hover)').matches){
  cardEmerge.addEventListener('mousemove',e=>{
    if(!opened)return;const r=e.currentTarget.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    card3d.style.transform=`rotateY(${px*7}deg) rotateX(${-py*6}deg)`;
  });
  cardEmerge.addEventListener('mouseleave',()=>{card3d.style.transform='rotateY(0deg) rotateX(0deg)';});
}
</script>
</body>
</html>
