<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c4a882">
<title>Our Scrapbook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Patrick+Hand&display=swap');

  :root {
    --desk: #8b6f47;
    --desk-dark: #6b5435;
    --paper: #f7f0e4;
    --paper-warm: #f2e8d5;
    --paper-shadow: #d9cbb3;
    --ink: #3d3428;
    --ink-soft: #6b5d4d;
    --tape: rgba(255, 230, 170, 0.72);
    --tape-blue: rgba(170, 210, 240, 0.65);
    --tape-pink: rgba(255, 190, 200, 0.68);
    --accent: #e07a5f;
    --accent-soft: #f4a261;
    --cover: #5c7c6b;
    --cover-dark: #3d5348;
    --ease-book: cubic-bezier(0.45, 0.05, 0.2, 1);
    --ease-snap: cubic-bezier(0.34, 1.2, 0.48, 1);
    --ease-turn: cubic-bezier(0.645, 0.045, 0.355, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255, 240, 200, 0.15), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0, 0, 0, 0.2), transparent 40%),
      linear-gradient(160deg, var(--desk-dark) 0%, var(--desk) 45%, #7a6240 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Desk grain texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size: 180px;
    mix-blend-mode: overlay;
    z-index: 0;
  }

  .desk-items {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .desk-doodle {
    position: absolute;
    opacity: 0.12;
    font-family: 'Patrick Hand', cursive;
    font-size: 1.4rem;
    color: #fff;
    transform: rotate(var(--rot, -12deg));
  }

  .stage {
    position: relative;
    z-index: 10;
    width: min(380px, 94vw);
    height: min(620px, 90vh);
    perspective: 1400px;
    perspective-origin: 50% 42%;
  }

  .stage::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -2%;
    width: 78%;
    height: 28px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    filter: blur(18px);
    transition: all 1s var(--ease-book);
  }

  .stage.opened::after {
    width: 62%;
    opacity: 0.55;
  }

  /* ---------- Scrapbook shell ---------- */
  .scrapbook {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 1.1s var(--ease-book);
  }

  .book-shadow {
    position: absolute;
    inset: 4% 3%;
    border-radius: 4px 12px 12px 4px;
    background: rgba(0, 0, 0, 0.28);
    filter: blur(12px);
    transform: translateY(8px) rotate(-0.5deg);
    pointer-events: none;
  }

  /* ---------- Cover ---------- */
  .cover {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.15s var(--ease-turn);
    z-index: 50;
    cursor: pointer;
  }

  .cover.opening,
  .cover.opened {
    transform: rotateY(-168deg);
    pointer-events: none;
  }

  .cover-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 4px 14px 14px 4px;
    overflow: hidden;
    box-shadow:
      2px 4px 0 rgba(0, 0, 0, 0.12),
      4px 8px 24px rgba(0, 0, 0, 0.35),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  .cover-front {
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, transparent 40%),
      linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
  }

  .cover-texture {
    position: absolute;
    inset: 0;
    opacity: 0.4;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)' opacity='0.4'/%3E%3C/svg%3E");
    background-size: 120px;
    mix-blend-mode: overlay;
  }

  .cover-stitch {
    position: absolute;
    left: 14px;
    top: 8%;
    bottom: 8%;
    width: 3px;
    border-left: 2px dashed rgba(255, 255, 255, 0.2);
  }

  .cover-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 2.5rem 2rem 2.8rem;
    text-align: center;
    gap: 0.6rem;
  }

  .cover-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
  }

  .cover-title {
    font-family: 'Amatic SC', cursive;
    font-size: clamp(2.6rem, 9vw, 3.4rem);
    font-weight: 700;
    color: #f5f0e6;
    line-height: 0.95;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    transform: rotate(-1.5deg);
  }

  .cover-sub {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.05rem;
    color: rgba(255, 255, 255, 0.75);
    max-width: 16ch;
    line-height: 1.35;
    transform: rotate(0.8deg);
  }

  .cover-for {
    margin-top: 1.2rem;
    font-family: 'Patrick Hand', cursive;
    font-size: 1.15rem;
    color: var(--accent-soft);
    transform: rotate(-2deg);
  }

  .cover-tape {
    position: absolute;
    width: 72px;
    height: 22px;
    background: var(--tape);
    opacity: 0.85;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }

  .cover-tape.t1 { top: 18%; right: 12%; transform: rotate(32deg); }
  .cover-tape.t2 { bottom: 22%; left: 10%; transform: rotate(-18deg); width: 58px; background: var(--tape-pink); }

  .cover-sticker {
    position: absolute;
    font-size: 1.6rem;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
  }

  .cover-sticker.s1 { top: 12%; left: 18%; transform: rotate(-14deg); }
  .cover-sticker.s2 { bottom: 14%; right: 16%; transform: rotate(8deg); font-size: 1.3rem; }

  .cover-hint {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    animation: hintPulse 2.8s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.85; transform: translateX(-50%) translateY(-3px); }
  }

  .cover-inside {
    transform: rotateY(180deg);
    background: var(--paper);
  }

  .cover-inside::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180, 160, 130, 0.12) 27px, rgba(180, 160, 130, 0.12) 28px);
    pointer-events: none;
  }

  /* ---------- Pages container ---------- */
  .pages {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 0.3s;
  }

  .pages.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .page {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform-style: preserve-3d;
    transition: opacity 0.35s ease;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 20;
  }

  .page.turning-out {
    z-index: 25;
    animation: pageTurnOut 0.65s var(--ease-turn) forwards;
  }

  .page.turning-in {
    z-index: 22;
    animation: pageTurnIn 0.65s var(--ease-turn) forwards;
  }

  @keyframes pageTurnOut {
    0% { transform: rotateY(0deg) rotateZ(0deg); opacity: 1; }
    100% { transform: rotateY(-92deg) rotateZ(var(--wobble, -1.2deg)); opacity: 0; }
  }

  @keyframes pageTurnIn {
    0% { transform: rotateY(12deg) rotateZ(var(--wobble, 1deg)); opacity: 0; }
    100% { transform: rotateY(0deg) rotateZ(0deg); opacity: 1; }
  }

  .page-sheet {
    position: absolute;
    inset: 0;
    background: var(--paper);
    border-radius: 2px 10px 10px 2px;
    overflow: hidden;
    box-shadow:
      inset -3px 0 8px rgba(0, 0, 0, 0.04),
      2px 3px 0 var(--paper-shadow),
      3px 6px 20px rgba(0, 0, 0, 0.18);
  }

  /* Torn top edge */
  .page-sheet::before {
    content: "";
    position: absolute;
    top: 0;
    left: -2px;
    right: -2px;
    height: 8px;
    background: var(--paper);
    clip-path: polygon(
      0% 100%, 3% 40%, 6% 80%, 9% 30%, 12% 70%, 15% 20%, 18% 75%,
      21% 35%, 24% 85%, 27% 25%, 30% 65%, 33% 15%, 36% 78%, 39% 40%,
      42% 88%, 45% 22%, 48% 72%, 51% 18%, 54% 82%, 57% 38%, 60% 90%,
      63% 28%, 66% 68%, 69% 12%, 72% 76%, 75% 42%, 78% 86%, 81% 24%,
      84% 74%, 87% 16%, 90% 80%, 93% 36%, 96% 84%, 100% 100%
    );
    z-index: 2;
  }

  .paper-texture {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)' opacity='0.35'/%3E%3C/svg%3E");
    background-size: 200px;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  .page-inner {
    position: relative;
    z-index: 3;
    height: 100%;
    padding: 1.4rem 1.3rem 4.5rem 1.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    overflow: hidden;
  }

  .spread-title {
    font-family: 'Amatic SC', cursive;
    font-size: clamp(1.8rem, 6vw, 2.2rem);
    font-weight: 700;
    color: var(--ink);
    transform: rotate(var(--title-tilt, -1.5deg));
    line-height: 1;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
    align-self: flex-start;
    padding-bottom: 2px;
    margin-bottom: 0.2rem;
  }

  .spread-notes {
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    line-height: 1.45;
    color: var(--ink-soft);
    transform: rotate(0.4deg);
    max-width: 95%;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.65rem;
    margin-top: 0.3rem;
    flex: 1;
    align-content: start;
  }

  .photo-grid.single { grid-template-columns: 1fr; justify-items: center; }
  .photo-grid.triple { grid-template-columns: 1fr 1fr; }
  .photo-grid.triple .polaroid:last-child { grid-column: 1 / -1; justify-self: center; width: 58%; }

  /* ---------- Polaroids ---------- */
  .polaroid {
    position: relative;
    background: #fff;
    padding: 6px 6px 28px;
    box-shadow:
      0 2px 0 rgba(0, 0, 0, 0.06),
      0 4px 12px rgba(0, 0, 0, 0.15);
    transform: rotate(var(--pol-rot, 0deg));
    cursor: pointer;
    transition: transform 0.35s var(--ease-snap), box-shadow 0.3s ease;
    touch-action: manipulation;
  }

  .polaroid::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%) rotate(var(--tape-rot, -4deg));
    width: 44px;
    height: 14px;
    background: var(--tape-color, var(--tape));
    opacity: 0.9;
    z-index: 2;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  .polaroid:active { transform: rotate(var(--pol-rot, 0deg)) scale(0.97); }

  .polaroid.revealed {
    transform: rotate(var(--pol-rot, 0deg)) scale(1.03);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    z-index: 5;
  }

  .polaroid-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #e8dfd0, #d4c8b5);
  }

  .polaroid-caption {
    position: absolute;
    bottom: 4px;
    left: 6px;
    right: 6px;
    font-family: 'Patrick Hand', cursive;
    font-size: 0.78rem;
    color: var(--ink);
    text-align: center;
    line-height: 1.2;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .polaroid.revealed .polaroid-caption {
    opacity: 1;
    transform: translateY(0);
  }

  .polaroid-hint {
    position: absolute;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.5;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .polaroid.revealed .polaroid-hint { opacity: 0; }

  /* ---------- Stickers on spreads ---------- */
  .spread-sticker {
    position: absolute;
    font-size: var(--stk-size, 1.4rem);
    transform: rotate(var(--stk-rot, 0deg));
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.15));
    pointer-events: none;
    z-index: 4;
    animation: stickerPop 0.5s var(--ease-snap) both;
    animation-delay: var(--stk-delay, 0s);
  }

  @keyframes stickerPop {
    0% { transform: rotate(var(--stk-rot, 0deg)) scale(0); opacity: 0; }
    70% { transform: rotate(var(--stk-rot, 0deg)) scale(1.15); }
    100% { transform: rotate(var(--stk-rot, 0deg)) scale(1); opacity: 1; }
  }

  /* ---------- Doodles ---------- */
  .doodle {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    opacity: 0.35;
  }

  .doodle svg { width: 100%; height: 100%; }

  /* ---------- Final note page ---------- */
  .final-page .page-inner {
    justify-content: center;
    align-items: center;
    text-align: center;
    padding-bottom: 5rem;
  }

  .final-envelope {
    width: 88%;
    max-width: 280px;
    background: var(--paper-warm);
    border: 1px dashed rgba(107, 93, 77, 0.35);
    padding: 1.6rem 1.4rem;
    transform: rotate(-0.8deg);
    box-shadow: 2px 4px 14px rgba(0, 0, 0, 0.1);
    position: relative;
  }

  .final-envelope::before,
  .final-envelope::after {
    content: "";
    position: absolute;
    width: 50px;
    height: 16px;
    background: var(--tape-blue);
    opacity: 0.8;
  }

  .final-envelope::before { top: -6px; left: 20%; transform: rotate(-8deg); }
  .final-envelope::after { bottom: -6px; right: 15%; transform: rotate(5deg); background: var(--tape-pink); }

  .final-greeting {
    font-family: 'Amatic SC', cursive;
    font-size: 1.6rem;
    color: var(--accent);
    margin-bottom: 0.8rem;
  }

  .final-message {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-line;
    text-align: left;
  }

  .final-signoff {
    margin-top: 1.2rem;
    font-family: 'Patrick Hand', cursive;
    font-size: 1.15rem;
    color: var(--ink-soft);
    text-align: right;
    transform: rotate(-1deg);
  }

  .final-hearts {
    margin-top: 1rem;
    font-size: 1.2rem;
    letter-spacing: 0.3em;
    opacity: 0.7;
    animation: heartFloat 3s ease-in-out infinite;
  }

  @keyframes heartFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* ---------- Navigation ---------- */
  .nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.8rem;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .nav.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .nav-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(61, 52, 40, 0.12);
    color: var(--ink);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .nav-btn:hover { background: rgba(61, 52, 40, 0.2); }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .nav-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(61, 52, 40, 0.2);
    transition: all 0.3s ease;
  }

  .nav-dot.active {
    width: 18px;
    border-radius: 3px;
    background: var(--accent);
  }

  .page-counter {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  /* ---------- Progress ribbon ---------- */
  .ribbon {
    position: absolute;
    top: -6px;
    right: 18px;
    width: 28px;
    height: 80px;
    background: linear-gradient(180deg, var(--accent) 0%, #c45c44 100%);
    clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
    z-index: 55;
    opacity: 0;
    transition: opacity 0.5s ease 0.6s;
    box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.2);
  }

  .stage.opened .ribbon { opacity: 1; }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    .cover.opening,
    .cover.opened { transform: rotateY(-168deg); }

    .page.turning-out,
    .page.turning-in { animation: none; opacity: 1; transform: none; }

    .cover-hint { animation: none; opacity: 0.6; }
    .final-hearts { animation: none; }
    .spread-sticker { animation: none; opacity: 1; }
  }

  /* ---------- Larger screens ---------- */
  @media (min-width: 420px) {
    .page-inner { padding: 1.6rem 1.5rem 4.8rem 1.8rem; }
    .spread-notes { font-size: 1.05rem; }
    .polaroid-caption { font-size: 0.85rem; }
  }
</style>
</head>
<body>

<div class="desk-items" id="deskItems" aria-hidden="true"></div>

<div class="stage" id="stage">
  <div class="ribbon" aria-hidden="true"></div>
  <div class="scrapbook" id="scrapbook">
    <div class="book-shadow" aria-hidden="true"></div>

    <!-- Cover -->
    <div class="cover" id="cover" role="button" tabindex="0" aria-label="Open scrapbook">
      <div class="cover-face cover-front">
        <div class="cover-texture"></div>
        <div class="cover-stitch"></div>
        <div class="cover-tape t1"></div>
        <div class="cover-tape t2"></div>
        <div class="cover-sticker s1" id="coverSticker1">🌟</div>
        <div class="cover-sticker s2" id="coverSticker2">📎</div>
        <div class="cover-content">
          <span class="cover-label">friendship scrapbook</span>
          <h1 class="cover-title" id="coverTitle">Our Story</h1>
          <p class="cover-sub" id="coverSub">little moments, big memories</p>
          <p class="cover-for" id="coverFor">for Alex</p>
        </div>
        <span class="cover-hint" id="coverHint">tap to open</span>
      </div>
      <div class="cover-face cover-inside" aria-hidden="true"></div>
    </div>

    <!-- Pages -->
    <div class="pages" id="pages"></div>
  </div>

  <nav class="nav" id="nav" aria-label="Page navigation">
    <button class="nav-btn" id="prevBtn" aria-label="Previous page" disabled>&#8592;</button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next page">&#8594;</button>
  </nav>
</div>

<script>
/* ============================================================
   EXPERIENCE — edit this object to personalize the scrapbook
   ============================================================ */
const EXPERIENCE = {
  recipient: 'Alex',
  sender: 'Jordan',
  cover: {
    title: 'Our Story',
    subtitle: 'little moments, big memories',
    stickers: ['🌟', '📎'],
  },
  spreads: [
    {
      title: 'Where it started',
      notes: 'Remember that random Tuesday? Neither of us knew we were about to become each other\'s person.',
      photos: [
        {
          src: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=400&h=400&fit=crop',
          caption: 'Day one — you laughed at my terrible joke ☕',
          rotate: -4,
        },
        {
          src: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=400&h=400&fit=crop',
          caption: 'The crew that became family',
          rotate: 3,
        },
      ],
      stickers: [
        { emoji: '⭐', top: 8, left: 78, rotate: -18, size: 1.3 },
        { emoji: '✏️', top: 72, left: 4, rotate: 12, size: 1.1 },
      ],
    },
    {
      title: 'Late nights & inside jokes',
      notes: '3am voice notes. That one meme we\'ve sent 400 times. The kind of friendship that doesn\'t need explaining.',
      photos: [
        {
          src: 'https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=400&h=400&fit=crop',
          caption: 'Plotting our next adventure',
          rotate: -2,
        },
        {
          src: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop',
          caption: 'Caught mid-laugh, obviously',
          rotate: 5,
        },
        {
          src: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=400&h=400&fit=crop',
          caption: 'That night we said "one more hour"',
          rotate: -3,
        },
      ],
      stickers: [
        { emoji: '😂', top: 14, left: 6, rotate: -8, size: 1.5 },
        { emoji: '💛', top: 55, left: 82, rotate: 14, size: 1.2 },
        { emoji: '🎵', top: 85, left: 42, rotate: -6, size: 1.1 },
      ],
    },
    {
      title: 'The good stuff',
      notes: 'Road trips, bad photos, perfect memories. Every page of this book is proof that the best things aren\'t planned.',
      photos: [
        {
          src: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400&h=400&fit=crop',
          caption: 'Windows down, playlist on 🚗',
          rotate: 2,
        },
        {
          src: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&h=400&fit=crop',
          caption: 'Views worth the detour',
          rotate: -5,
        },
      ],
      stickers: [
        { emoji: '🗺️', top: 10, left: 70, rotate: 10, size: 1.4 },
        { emoji: '📸', top: 78, left: 8, rotate: -12, size: 1.2 },
      ],
    },
  ],
  finalNote: {
    message: 'I made this little scrapbook because some friendships deserve more than a text.\n\nYou\'ve been there through the messy parts and the magic ones. The loud laughs and the quiet "you okay?" moments.\n\nThank you for being my person. Here\'s to a million more pages.',
    hearts: '💛 ✨ 🫂',
  },
};

/* ---------- Init ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const cover = document.getElementById('cover');
const pagesEl = document.getElementById('pages');
const nav = document.getElementById('nav');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const navDots = document.getElementById('navDots');

let opened = false;
let opening = false;
let currentPage = 0;
let turning = false;
const totalPages = EXPERIENCE.spreads.length + 1;

const TAPE_COLORS = ['var(--tape)', 'var(--tape-blue)', 'var(--tape-pink)'];

function applyConfig() {
  document.title = EXPERIENCE.cover.title + ' · Scrapbook';
  document.getElementById('coverTitle').textContent = EXPERIENCE.cover.title;
  document.getElementById('coverSub').textContent = EXPERIENCE.cover.subtitle;
  document.getElementById('coverFor').textContent = 'for ' + EXPERIENCE.recipient;

  const stickers = EXPERIENCE.cover.stickers || ['🌟', '📎'];
  document.getElementById('coverSticker1').textContent = stickers[0] || '🌟';
  document.getElementById('coverSticker2').textContent = stickers[1] || '📎';

  EXPERIENCE.finalNote.greeting = 'Hey ' + EXPERIENCE.recipient + ',';
  EXPERIENCE.finalNote.signoff = 'Always, ' + EXPERIENCE.sender;

  buildPages();
  buildNavDots();
  buildDeskDoodles();
}

function buildDeskDoodles() {
  const items = ['✿', '★', '~', '→', '♡', '...'];
  const host = document.getElementById('deskItems');
  for (let i = 0; i < 8; i++) {
    const d = document.createElement('div');
    d.className = 'desk-doodle';
    d.textContent = items[i % items.length];
    d.style.left = (5 + Math.random() * 88) + '%';
    d.style.top = (5 + Math.random() * 88) + '%';
    d.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
    host.appendChild(d);
  }
}

function buildPages() {
  pagesEl.innerHTML = '';

  EXPERIENCE.spreads.forEach((spread, idx) => {
    const page = document.createElement('div');
    page.className = 'page';
    page.dataset.index = idx;
    page.setAttribute('role', 'region');
    page.setAttribute('aria-label', 'Memory spread: ' + spread.title);

    const photoCount = spread.photos.length;
    const gridClass = photoCount === 1 ? 'single' : photoCount === 3 ? 'triple' : '';

    let photosHTML = '';
    spread.photos.forEach((photo, pi) => {
      const rot = photo.rotate ?? (pi % 2 === 0 ? -3 : 4);
      const tapeColor = TAPE_COLORS[pi % TAPE_COLORS.length];
      const tapeRot = (pi % 2 === 0 ? -4 : 6) + rot * 0.3;
      photosHTML += `
        <div class="polaroid" style="--pol-rot:${rot}deg;--tape-color:${tapeColor};--tape-rot:${tapeRot}deg"
             role="button" tabindex="0" aria-label="Photo: tap to reveal caption">
          <img class="polaroid-img" src="${photo.src}" alt="${photo.alt || photo.caption || 'Memory photo'}" loading="lazy">
          <span class="polaroid-caption">${photo.caption}</span>
          <span class="polaroid-hint">tap me</span>
        </div>`;
    });

    let stickersHTML = '';
    (spread.stickers || []).forEach((stk, si) => {
      stickersHTML += `<div class="spread-sticker" style="
        top:${stk.top}%;left:${stk.left}%;
        --stk-rot:${stk.rotate || 0}deg;
        --stk-size:${stk.size || 1.4}rem;
        --stk-delay:${si * 0.08}s;
      ">${stk.emoji}</div>`;
    });

    const titleTilt = (idx % 2 === 0 ? -1.5 : 1.2) + (idx * 0.3);
    page.innerHTML = `
      <div class="page-sheet">
        <div class="paper-texture"></div>
        ${stickersHTML}
        ${doodleSVG(idx)}
        <div class="page-inner">
          <h2 class="spread-title" style="--title-tilt:${titleTilt}deg">${spread.title}</h2>
          <p class="spread-notes">${spread.notes}</p>
          <div class="photo-grid ${gridClass}">${photosHTML}</div>
        </div>
      </div>`;

    pagesEl.appendChild(page);
  });

  const finalPage = document.createElement('div');
  finalPage.className = 'page final-page';
  finalPage.dataset.index = EXPERIENCE.spreads.length;
  finalPage.setAttribute('role', 'region');
  finalPage.setAttribute('aria-label', 'Final note');
  finalPage.innerHTML = `
    <div class="page-sheet">
      <div class="paper-texture"></div>
      ${doodleSVG(99)}
      <div class="page-inner">
        <div class="final-envelope">
          <p class="final-greeting">${EXPERIENCE.finalNote.greeting}</p>
          <p class="final-message">${EXPERIENCE.finalNote.message}</p>
          <p class="final-signoff">${EXPERIENCE.finalNote.signoff}</p>
        </div>
        <div class="final-hearts">${EXPERIENCE.finalNote.hearts || '💛 ✨'}</div>
      </div>
    </div>`;
  pagesEl.appendChild(finalPage);
}

function doodleSVG(seed) {
  const doodles = [
  `<div class="doodle" style="top:6%;right:8%;width:36px;height:36px"><svg viewBox="0 0 40 40" fill="none" stroke="#e07a5f" stroke-width="1.5"><path d="M5 20 Q20 5 35 20 Q20 35 5 20"/></svg></div>`,
  `<div class="doodle" style="bottom:18%;left:6%;width:44px;height:20px"><svg viewBox="0 0 50 20" fill="none" stroke="#6b5d4d" stroke-width="1.2"><path d="M2 10 L48 10 M40 4 L48 10 L40 16"/></svg></div>`,
  `<div class="doodle" style="top:40%;right:4%;width:28px;height:28px"><svg viewBox="0 0 30 30" fill="none" stroke="#f4a261" stroke-width="1.3"><polygon points="15,2 18,12 28,12 20,18 23,28 15,22 7,28 10,18 2,12 12,12"/></svg></div>`,
  ];
  return doodles[seed % doodles.length];
}

function buildNavDots() {
  navDots.innerHTML = '';
  for (let i = 0; i < totalPages; i++) {
    const dot = document.createElement('span');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-hidden', 'true');
    navDots.appendChild(dot);
  }
}

function updateNav() {
  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage === totalPages - 1;
  navDots.querySelectorAll('.nav-dot').forEach((d, i) => {
    d.classList.toggle('active', i === currentPage);
  });
}

function showPage(index, animate) {
  const allPages = pagesEl.querySelectorAll('.page');
  const prev = allPages[currentPage];
  const next = allPages[index];

  if (!animate || reduceMotion || !prev || prev === next) {
    allPages.forEach((p, i) => p.classList.toggle('active', i === index));
    currentPage = index;
    updateNav();
    return;
  }

  turning = true;
  const wobble = (Math.random() * 2.4 - 1.2).toFixed(1);
  prev.style.setProperty('--wobble', wobble + 'deg');
  next.style.setProperty('--wobble', (-parseFloat(wobble) * 0.6).toFixed(1) + 'deg');

  prev.classList.remove('active');
  prev.classList.add('turning-out');
  next.classList.add('turning-in', 'active');

  const duration = reduceMotion ? 0 : 650;
  setTimeout(() => {
    prev.classList.remove('turning-out');
    next.classList.remove('turning-in');
    allPages.forEach((p, i) => p.classList.toggle('active', i === index));
    currentPage = index;
    updateNav();
    turning = false;
  }, duration);
}

function goNext() {
  if (turning || !opened || currentPage >= totalPages - 1) return;
  showPage(currentPage + 1, true);
}

function goPrev() {
  if (turning || !opened || currentPage <= 0) return;
  showPage(currentPage - 1, true);
}

function openBook() {
  if (opened || opening) return;
  opening = true;
  cover.classList.add('opening');

  const delay = reduceMotion ? 50 : 1150;
  setTimeout(() => {
    cover.classList.add('opened');
    cover.classList.remove('opening');
    stage.classList.add('opened');
    pagesEl.classList.add('visible');
    nav.classList.add('visible');
    showPage(0, false);
    opened = true;
    opening = false;
    document.getElementById('coverHint').style.opacity = '0';
  }, delay);
}

function handlePolaroidTap(el) {
  const wasRevealed = el.classList.contains('revealed');
  el.closest('.photo-grid')?.querySelectorAll('.polaroid.revealed').forEach(p => {
    if (p !== el) p.classList.remove('revealed');
  });
  el.classList.toggle('revealed', !wasRevealed);
}

/* ---------- Events ---------- */
cover.addEventListener('click', openBook);
cover.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
});

prevBtn.addEventListener('click', e => { e.stopPropagation(); goPrev(); });
nextBtn.addEventListener('click', e => { e.stopPropagation(); goNext(); });

pagesEl.addEventListener('click', e => {
  const pol = e.target.closest('.polaroid');
  if (pol) { e.stopPropagation(); handlePolaroidTap(pol); return; }
  if (opened && !turning && currentPage < totalPages - 1) goNext();
});

pagesEl.addEventListener('keydown', e => {
  const pol = e.target.closest('.polaroid');
  if (pol && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    handlePolaroidTap(pol);
  }
});

let touchStartX = 0;
pagesEl.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });

pagesEl.addEventListener('touchend', e => {
  if (!opened || turning) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) < 50) return;
  if (dx < 0) goNext();
  else goPrev();
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!opened) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goNext(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goPrev(); }
});

applyConfig();
</script>
